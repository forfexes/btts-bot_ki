name: NETRATTLER Sportmonks Secret Smoke (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/netrattler_sportmonks_secret_test.yml

permissions:
  contents: read

concurrency:
  group: netrattler-sportmonks-single-key-test
  cancel-in-progress: true

jobs:
  sportmonks-key-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SPORTMONKS_API_KEY: \${{ secrets.SPORTMONKS_API_KEY }}
      TELEGRAM_TOKEN: ''
      SUPABASE_URL: ''
      LMG_SEND: 'false'
    steps:
      - name: Test configured Sportmonks API key, do not expose value
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode

          raw = os.environ.get("SPORTMONKS_API_KEY", "").strip()
          key = raw.replace("\r", "").split("\n", 1)[0].split(",", 1)[0].strip().strip('"').strip("'")
          if key.lower().startswith("bearer "):
              key=key[7:].strip()
          if key.lower().startswith("api_token="):
              key=key[10:].strip()
          if not key:
              print("SPORTMONKS_SECRET=missing")
              sys.exit(2)
          print("SPORTMONKS_SECRET=present (value not displayed)")

          # Compare both documented token transports without printing the key.
          urls = [
              ("leagues_query", "https://api.sportmonks.com/v3/football/leagues","query"),
              ("live_query", "https://api.sportmonks.com/v3/football/livescores/inplay","query"),
              ("leagues_bearer", "https://api.sportmonks.com/v3/football/leagues","bearer"),
          ]
          report=[]
          for name,url,mode in urls:
              target=url+"?"+urlencode({"api_token":key}) if mode=="query" else url
              headers={"Accept":"application/json",
                       "User-Agent":"NETRATTLER-Sportmonks-Key-Check/1.0"}
              if mode=="bearer":
                  headers["Authorization"]="Bearer "+key
              req=Request(target,headers=headers)
              try:
                  with urlopen(req, timeout=16) as resp:
                      status=resp.status
                      payload=json.load(resp)
                      num=len(payload["data"]) if isinstance(payload,dict) and isinstance(payload.get("data"),list) else None
              except HTTPError as exc:
                  status=exc.code
                  num=None
              except (URLError,TimeoutError,ValueError,TypeError,KeyError):
                  status="network_or_schema_error"
                  num=None
              msg="OK" if status==200 else (
                  "KEY_INVALID_OR_UNAUTHORIZED" if status==401 else
                  "PLAN_NOT_ENTITLED" if status==403 else
                  "RATE_LIMITED" if status==429 else "ERROR")
              row={"endpoint":name,"http_status":status,"result":msg,"rows":num}
              report.append(row)
              print("SPORTMONKS_CHECK "+json.dumps(row,sort_keys=True))
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a",encoding="utf-8") as output:
                  output.write("### Sportmonks API smoke test (no key disclosed)\n\n")
                  for row in report:
                      output.write(f'- {row["endpoint"]}: HTTP {row["http_status"]} / {row["result"]}, entries={row["rows"]}\n')
          if any(row["http_status"]==401 for row in report):
              sys.exit(3)
          if not any(row["http_status"]==200 for row in report):
              sys.exit(4)
          PY
