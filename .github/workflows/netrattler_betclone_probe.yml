name: NETRATTLER BetClone Platform Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_betclone_probe.yml'
      - 'netrattler_betclone_probe.py'
      - 'test_netrattler_betclone_probe.py'
      - 'netrattler_betclone_hardprobe.py'
      - 'test_netrattler_betclone_hardprobe.py'
  schedule:
    - cron: '42 7 * * 1'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependency
        run: pip install requests beautifulsoup4
      - name: Test read-only platform probe
        run: python -m unittest -v test_netrattler_betclone_probe.py test_netrattler_betclone_hardprobe.py
      - name: Probe four BetClone platform families
        run: python netrattler_betclone_probe.py
      - name: Audit all 10 BetClone groups and every listed brand (unverified domains flagged)
        run: python netrattler_betclone_hardprobe.py --timeout 6 --workers 10 --all-brands
      - name: Summarize exact BetClone audit coverage (catalogue vs proven odds)
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("netrattler_betclone_hardprobe.json")
          if not path.exists():
              print("BETCLONE_AUDIT missing_report")
              raise SystemExit(1)
          report = json.loads(path.read_text(encoding="utf-8"))
          print("BETCLONE_AUDIT family_catalogue=",
                report.get("catalogue_families_retrieved"),
                "listed_brands=", report.get("catalogue_total_listed_entries"),
                "curated_homepages_tested=", report.get("sites_checked"),
                "listed_brands_with_curated_domain=", report.get("catalogue_brands_tested"),
                "listed_brands_without_curated_domain=", report.get("catalogue_brands_awaiting_verified_domain"))
          print("BETCLONE_AUDIT unverified_guessed_domains_probed=",
                report.get("unverified_candidate_domains_probed"),
                "candidate_states=", report.get("unverified_candidate_probe_states"))
          print("BETCLONE_AUDIT warning=Homepage_HTTP_200_is_not_a_usable_odds_feed")
          for group, data in sorted(report.get("catalogue", {}).items()):
              print("BETCLONE_GROUP", group, "listed=", data.get("count"),
                    "http=", data.get("http"), "catalogue_state=", data.get("status"))
          for item in report.get("unverified_candidate_review_queue", [])[:25]:
              print("BETCLONE_REVIEW", item.get("platform"), item.get("brand"),
                    "priority=", item.get("priority"), "identity=", item.get("identity_signal"),
                    "state=", item.get("state"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-betclone-platform-probe
          path: |
            netrattler_betclone_probe_summary.json
            netrattler_betclone_hardprobe.json
          retention-days: 7
