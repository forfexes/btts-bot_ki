name: NETRATTLER Backfill 475K Football History

on:
  workflow_dispatch:
    inputs:
      max_rows:
        description: "0 = alle Rows, sonst Limit zum Testen z.B. 5000"
        required: false
        default: "0"
      chunk_size:
        description: "Supabase Upsert Chunk Size"
        required: false
        default: "500"

jobs:
  backfill-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas python-dotenv

      - name: Try applying SQL schema via psql
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          DB_URL=""
          if [ -n "$SUPABASE_DB_URL" ]; then
            DB_URL="$SUPABASE_DB_URL"
          elif [ -n "$DATABASE_URL" ]; then
            DB_URL="$DATABASE_URL"
          elif [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_URL" ]; then
            PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
            DB_URL="postgresql://postgres:${SUPABASE_DB_PASSWORD}@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"
          fi

          if [ -z "$DB_URL" ]; then
            echo "⚠️ Kein DB URL/DB Passwort Secret gefunden."
            echo "⚠️ Schema wird nicht automatisch angelegt."
            echo "⚠️ Setze SUPABASE_DB_PASSWORD oder SUPABASE_DB_URL, falls der Backfill wegen fehlender Tabellen scheitert."
            exit 0
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase_football_history_schema.sql
          echo "✅ History Schema applied"

      - name: Run 475K History Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HISTORY_MAX_ROWS: ${{ github.event.inputs.max_rows }}
          HISTORY_CHUNK_SIZE: ${{ github.event.inputs.chunk_size }}
          HISTORY_READ_CHUNK_SIZE: "25000"
        run: |
          python backfill_football_history.py
