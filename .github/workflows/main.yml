name: Daily BTTS Tipps

on:
  schedule:
    - cron: "0 6,12,17 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        run: python btts_daily.py
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_BTTS: ${{ secrets.TELEGRAM_GROUP_BTTS }}
          TELEGRAM_GROUP_OVER25: ${{ secrets.TELEGRAM_GROUP_OVER25 }}
          TELEGRAM_GROUP_COMBO: ${{ secrets.TELEGRAM_GROUP_COMBO }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          MARKETS_TO_RUN: "btts,over25,combo,btts_ht"

          MIN_ODDS: "1.60"
          MAX_ODDS: "3.20"
          MIN_PROBABILITY: "62"
          MIN_CONFIDENCE: "4"

          MIN_PROBABILITY_BTTS_HT: "60"
          MIN_ODDS_BTTS_HT: "1.80"
          MAX_ODDS_BTTS_HT: "3.80"

          MIN_VALUE_EDGE_PCT: "6"
          REQUIRE_HIGH_VALUE: "true"
          VALUE_SCORE_MIN: "65"

          AUTO_LEAGUE_SWITCH: "true"
          USE_GROQ_FALLBACK: "false"
          MAX_LEAGUES_PER_RUN: "20"
          AI_SLEEP_SECONDS: "1.5"
