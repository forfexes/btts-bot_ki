name: NETRATTLER TG Cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = nur zaehlen, 0 = loeschen"
        default: "1"
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CLEAN_FROM: "2026-10-31T02:40:00+00:00"
          CLEAN_TO: "2026-10-31T02:55:00+00:00"
        run: python netrattler_tg_cleanup.py
