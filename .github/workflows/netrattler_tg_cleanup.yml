name: NETRATTLER TG Cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = nur zaehlen, 0 = loeschen"
        default: "1"
      mode:
        description: "leer = Markt-Analyse-Aufraeumen, scorer_dups = Goalscorer-Doppelte, match_dups = andere Maerkte"
        default: "scorer_dups"
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          CLEAN_MODE: ${{ github.event.inputs.mode }}
          CLEAN_FROM: ${{ (github.event.inputs.mode == 'scorer_dups' || github.event.inputs.mode == 'match_dups') && '2026-11-02T00:00:00+00:00' || '2026-10-31T02:40:00+00:00' }}
          CLEAN_TO: ${{ (github.event.inputs.mode == 'scorer_dups' || github.event.inputs.mode == 'match_dups') && '2026-11-03T00:00:00+00:00' || '2026-10-31T02:55:00+00:00' }}
        run: python netrattler_tg_cleanup.py
