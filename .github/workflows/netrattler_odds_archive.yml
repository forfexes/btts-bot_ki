name: NETRATTLER Odds Archiv (Kopie nach V4)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests psycopg2-binary
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          V4_DATABASE_URL: ${{ secrets.V4_DATABASE_URL }}
        run: python netrattler_odds_archive.py
