name: NETRATTLER AI Tipp Bot

on:
  schedule:
    - cron: "30 9 * * *"  # 11:30 CH — Frühspiele (Serie A 12:30, PL 13:30)
    - cron: "0 13 * * 6,0" # 15:00 CH — Sa/So Nachmittag (BuLi 15:30)
    - cron: "0 16 * * 6,0" # 18:00 CH — Sa/So Nachmittag (PL 18:30, BuLi 18:30)
    - cron: "0 19 * * *"  # 21:00 CH — Abend (CL 21:00, LaLiga 21:00, Serie A 20:45)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run Mode"
        required: false
        default: "tips"
        type: choice
        options:
          - tips
          - settlement
          - both

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime Dependencies (lean)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --prefer-binary \
            requests \
            python-dotenv \
            beautifulsoup4 \
            lxml \
            cloudscraper \
            curl_cffi \
            numpy \
            scipy \
            scikit-learn
          python -m pip install --prefer-binary --no-deps "xgboost==3.2.0"

      - name: Fast syntax check
        run: |
          python -m py_compile btts_bot.py netrattler_builder_engine.py netrattler_builder_guard.py netrattler_builder_styles.py netrattler_builder_concepts_v2.py netrattler_runtime_patch.py netrattler_odds_cache_guard.py netrattler_aiscore.py netrattler_hardtest.py \
            test_netrattler_builder_guard.py test_netrattler_builder_styles.py test_netrattler_builder_concepts_v2.py test_netrattler_runtime_patch.py test_netrattler_odds_cache_guard.py test_netrattler_aiscore.py \
            netrattler_result_enrichment.py netrattler_fotmob_results.py netrattler_settlement_runner.py \
            test_netrattler_result_enrichment.py test_netrattler_fotmob_results.py test_netrattler_settlement_runner.py data_fusion_v15.py \
            netrattler_runtime_policy.py netrattler_market_consensus_v36.py \
            netrattler_exposure_engine_v36.py netrattler_coverage_watchdog_v37.py \
            netrattler_model_registry_v37.py netrattler_oddspapi.py netrattler_free_odds.py netrattler_fixture_recovery.py test_netrattler_fixture_recovery.py test_netrattler_oddspapi_keys.py netrattler_quote_consensus.py netrattler_fivedollar.py netrattler_fieldfunded.py netrattler_sockodds.py
          for f in netrattler_identity_hub.py netrattler_ml_player.py netrattler_prop_sources.py netrattler_source_hub.py netrattler_stat_sources.py; do
            [ ! -f "$f" ] || python -m py_compile "$f"
          done

      - name: Runtime odds/skip regression tests
        run: |
          python test_netrattler_runtime_patch.py
          python test_netrattler_odds_cache_guard.py
          python test_netrattler_aiscore.py
          python test_netrattler_fixture_recovery.py

      - name: Consolidated NETRATTLER hardtest
        run: python netrattler_hardtest.py

      - name: Run Tips Bot 🤖
        env:
          NETRATTLER_FAST_TIPS:       "true"
          NETRATTLER_STATBUNKER_MAX_LOOKUPS: "0"
          NETRATTLER_LINEUP_MAX:      "8"
          GEMINI_API_KEYS:            ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS:              ${{ secrets.GROQ_API_KEYS }}
          OPENROUTER_API_KEYS:        ${{ secrets.OPENROUTER_API_KEYS }}
          MISTRAL_API_KEYS:           ${{ secrets.MISTRAL_API_KEYS }}
          COHERE_API_KEY:             ${{ secrets.COHERE_API_KEY }}
          HUGGINGFACE_API_KEY:        ${{ secrets.HUGGINGFACE_API_KEY }}
          TAVILY_API_KEY:             ${{ secrets.TAVILY_API_KEY }}
          ODDS_API_KEYS:              ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_NET_KEY:           ${{ secrets.ODDS_API_NET_KEY }}
          FOOTBALL_DATA_API_KEYS:     ${{ secrets.FOOTBALL_DATA_API_KEYS }}
          API_FOOTBALL_KEYS:          ${{ secrets.API_FOOTBALL_KEYS }}
          SPORTMONKS_API_KEY:         ${{ secrets.SPORTMONKS_API_KEY }}
          SPORTDB_API_KEY:            ${{ secrets.SPORTDB_API_KEY }}
          ALLSPORTS_API_KEY:          ${{ secrets.ALLSPORTS_API_KEY }}
          FOOTYSTATS_API_KEY:         ${{ secrets.FOOTYSTATS_API_KEY }}
          OPENWEATHER_API_KEY:        ${{ secrets.OPENWEATHER_API_KEY }}
          THESTATSAPI_KEY:            ${{ secrets.THESTATSAPI_KEY }}
          THESTATSAPI_KEYS:           ${{ secrets.THESTATSAPI_KEYS }}
          API_NINJAS_KEY:             ${{ secrets.API_NINJAS_KEY }}
          TELEGRAM_TOKEN:             ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_BTTS:        ${{ secrets.TELEGRAM_GROUP_BTTS }}
          TELEGRAM_GROUP_OVER25:      ${{ secrets.TELEGRAM_GROUP_OVER25 }}
          TELEGRAM_GROUP_COMBO:       ${{ secrets.TELEGRAM_GROUP_COMBO }}
          TELEGRAM_GROUP_COMBOS:      ${{ secrets.TELEGRAM_GROUP_COMBOS }}
          TELEGRAM_GROUP_BTTS_HT:     ${{ secrets.TELEGRAM_GROUP_BTTS_HT }}
          TELEGRAM_GROUP_HZ_LIVE:     ${{ secrets.TELEGRAM_GROUP_HZ_LIVE }}
          TELEGRAM_GROUP_CORNERS:     ${{ secrets.TELEGRAM_GROUP_CORNERS }}
          TELEGRAM_GROUP_LATE_GOALS:  ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          TELEGRAM_GROUP_STATS:       ${{ secrets.TELEGRAM_GROUP_STATS }}
          TELEGRAM_GROUP_PLAYER_PROPS: ${{ secrets.TELEGRAM_GROUP_PLAYER_PROPS }}
          TELEGRAM_GROUP_BUILDER:     ${{ secrets.TELEGRAM_GROUP_BUILDER }}
          TELEGRAM_GROUP_OVER15_HT:   ${{ secrets.TELEGRAM_GROUP_OVER15_HT }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:               ${{ secrets.SUPABASE_KEY }}
          SUPABASE_PLAYERS_URL:       ${{ secrets.SUPABASE_PLAYERS_URL }}
          SUPABASE_PLAYERS_SERVICE_KEY: ${{ secrets.SUPABASE_PLAYERS_SERVICE_KEY }}
          ODDSPAPI_KEYS:              ${{ secrets.ODDSPAPI_KEYS }}
          ODDSPAPI_KEY:               ${{ secrets.ODDSPAPI_KEY }}
          FIVEDOLLAR_API_KEY:          ${{ secrets.FIVEDOLLAR_API_KEY }}
          FIELDFUNDED_API_KEY:         ${{ secrets.FIELDFUNDED_API_KEY }}
          SOCKODDS_API_KEY:            ${{ secrets.SOCKODDS_API_KEY }}
          NETRATTLER_NEW_ODDS_SHADOW:  "true"
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BIGBALLS_API_KEY:           ${{ secrets.BIGBALLS_API_KEY }}
          BBS_API_KEY:                ${{ secrets.BBS_API_KEY }}
          RUN_MODE:                   ${{ github.event.inputs.mode || 'tips' }}
          ENABLE_SETTLEMENT:          "false"
          ENABLE_ADVANCED_PROPS:      "true"
          ENABLE_TEAM_LEGS_IN_PROP_BUILDER: "true"
          NETRATTLER_BUILDER_ALLOW_TEAM_MARKETS: "true"
          ENABLE_SUPABASE_PROP_STATS: "1"
          PLAYER_LOG_USE_MAIN_DB: "1"
          MAX_LEAGUES_PER_RUN:        "0"
          PARALLEL_WORKERS:           "10"
          AI_SLEEP_SECONDS:           "0.1"
          GROQ_SLEEP_SECONDS:         "0.5"
          NETRATTLER_ANALYSIS_BUDGET_SEC: "840"
          NETRATTLER_LEAGUE_FALLBACK_BUDGET_SEC: "45"
          NETRATTLER_GLOBAL_BUDGET_SEC: "900"
          NETRATTLER_HARD_WATCHDOG_SEC: "960"
          NETRATTLER_CORNERS_BUDGET_SEC: "60"
          NETRATTLER_EXTRA_PROP_MAX_MATCHES: "60"
          NETRATTLER_KAMBI_SPECIAL_FALLBACK: "true"
          NETRATTLER_KAMBI_SPECIAL_MAX_MATCHES: "24"
          NETRATTLER_HT_KAMBI_MAX_MATCHES: "24"
          NETRATTLER_ML_PREFETCH_TEAM_CAP: "160"
          NETRATTLER_ML_PREFETCH_BATCH: "80"
          NETRATTLER_ML_PREFETCH_BUDGET_SEC: "12"
          NETRATTLER_ML_PREFETCH_ROW_LIMIT: "3000"
          # Real odds fallback chain. Pinnacle remains first; only observed prices
          # from snapshots/1xBet/Kambi/odds-api.net/OddsPapi/odds_history may fill gaps.
          NETRATTLER_ENABLE_ODDSPAPI_RUNTIME: "true"
          # Detail /odds only for candidates; fixtures remain one cached broad call.
          NETRATTLER_ODDSPAPI_MAX_CALLS: "8"
          NETRATTLER_FALLBACK_CANDIDATE_MIN_PROB: "45"
          NETRATTLER_FALLBACK_LOG_LIMIT: "20"
          NETRATTLER_ODDS_CACHE_TTL: "600"
          NETRATTLER_ODDS_CACHE_MAX_ROWS: "5000"
          NETRATTLER_ODDS_CACHE_MAX_AGE_HOURS: "18"
          NETRATTLER_ODDS_CACHE_LOG_LIMIT: "20"
          # Old count-only skip is now market-coverage aware.
          # Full league fallback should cover broad markets, not block the whole run
          # for specialist quotes that only exist when bookmakers offer them.
          NETRATTLER_SKIP_REQUIRED_MARKETS: "btts,over25,combo,btts_ht,over15_ht,1x2"
          NETRATTLER_SKIP_MIN_PER_MARKET: "1"
          NETRATTLER_SKIP_TOTAL_MIN: "10"
          NETRATTLER_BTTS_HT_MIN_PROB: "32"
          NETRATTLER_BTTS_HT_MIN_EDGE: "0.02"
          NETRATTLER_OVER15_HT_MIN_PROB: "35"
          NETRATTLER_OVER15_HT_MIN_EDGE: "0.02"
          NETRATTLER_COMBO_MIN_PROB: "45"
          NETRATTLER_COMBO_MIN_EDGE: "0.02"
          NETRATTLER_COMBO_COMPONENT_MIN_PROB: "45"
          NETRATTLER_1X2_MIN_PROB: "52"
          MAX_ODDS:                    "3.0"
          NETRATTLER_TEAM_COMBO_MAX_ODDS: "6.0"
          NETRATTLER_MULTI_COMBO_MAX_ODDS: "500"
          NETRATTLER_BTTS_HT_MAX_ODDS: "4.5"
          NETRATTLER_SUPABASE_SAVE_WORKERS: "6"
          NETRATTLER_MAX_SINGLE_ODDS: "3.0"
          NETRATTLER_1X2_MIN_EDGE:    "0.01"
          NETRATTLER_1X2_MIN_ODDS:    "1.55"
          NETRATTLER_1X2_CONSENSUS_MIN_PROB: "58"
          NETRATTLER_1X2_CONSENSUS_MODEL_FLOOR: "50"
          NETRATTLER_1X2_CONSENSUS_MAX_GAP: "10"
          NETRATTLER_1X2_CONSENSUS_MAX_ODDS: "2.10"
          NETRATTLER_SCORER_MIN_PROB: "0.35"
          NETRATTLER_SCORER_MIN_EDGE: "0.03"
          NETRATTLER_SCORER_MIN_ODDS: "1.70"
          NETRATTLER_MAX_SCORER_PROPS_PER_RUN: "8"
          NETRATTLER_CORNER_EXTRA_MATCHES: "30"
          NETRATTLER_CORNER_MIN_EDGE: "0.02"
          NETRATTLER_FAST_PLAYER_ML_CAP: "96"
          NETRATTLER_PIN_RELATED_SPECIAL_CAP: "36"
          NETRATTLER_PIN_RELATED_SPECIAL_BUDGET_SEC: "25"
          NETRATTLER_PIN_RELATED_SPECIAL_TIMEOUT: "3.0"
          NETRATTLER_SHARP_PROP_MIN_PROB: "0.50"
          NETRATTLER_PLAYER_PROP_MIN_PROB: "0.55"
          NETRATTLER_PLAYER_PROP_MIN_EDGE: "0.03"
          NETRATTLER_PLAYER_PROP_MAX_ODDS: "0"
          NETRATTLER_BUILDER_MAX_ODDS: "0"
          NETRATTLER_MAX_BUILDERS_PER_RUN: "18"
          NETRATTLER_MAX_BUILDERS_PER_MATCH: "4"
          NETRATTLER_PROP_BUILDER_MIN_ODDS: "2.5"
          NETRATTLER_BUILDER_MIN_ODDS: "2.5"
          NETRATTLER_BUILDER_MAX_LEGS: "9"
          NETRATTLER_MULTI_COMBO_MAX_LEGS: "11"
          NETRATTLER_PROP_BUILDER_MIN_EDGE: "0.02"
          ENABLE_DATA_FUSION_V15: "true"
          DATA_FUSION_V15_TIMEOUT: "4"
          DATA_FUSION_V15_CACHE_SECONDS: "3600"
          NETRATTLER_SOURCE_BREAKER_FAILURES: "2"
          NETRATTLER_SOURCE_BREAKER_MINUTES: "20"
          NETRATTLER_PROP_BUILDER_MAX_MODEL_MARKET_RATIO: "4.0"
          NETRATTLER_PROP_BUILDER_MAX_ABS_EDGE: "0.30"
          NETRATTLER_ENABLE_LEGACY_PROP_BUILDER: "false"
          NETRATTLER_ENABLE_SCREENSHOT_BUILDERS: "false"
        run: |
          python -c "import netrattler_runtime_patch as patch; patch.install_pre_guard(); import btts_bot; patch.install_bot(btts_bot); import netrattler_odds_cache_guard as cache_guard; cache_guard.install(btts_bot); import netrattler_builder_guard as guard; import netrattler_builder_styles as styles; import netrattler_builder_concepts_v2 as concepts; styles.install(); concepts.install(); guard.main()"
