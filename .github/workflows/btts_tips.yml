name: BTTS Tips Bot 🤖
on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC - Asien
    - cron: '0 8 * * *'    # 08:00 UTC - Europa Morgen
    - cron: '0 13 * * *'   # 13:00 UTC - Mittag
    - cron: '0 17 * * *'   # 17:00 UTC - Europa Abend
    - cron: '0 22 * * *'   # 22:00 UTC - Amerika
  workflow_dispatch:
concurrency:
  group: btts-tips
  cancel-in-progress: false
jobs:
  run-tips:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Run Tips Bot 🤖
        env:
          RUN_MODE: "tips"
          # 🤖 AI
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          # 📊 Daten
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          FOOTBALL_DATA_API_KEYS: ${{ secrets.FOOTBALL_DATA_API_KEYS }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          SPORTDB_API_KEY: ${{ secrets.SPORTDB_API_KEY }}
          ALLSPORTS_API_KEY: ${{ secrets.ALLSPORTS_API_KEY }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          # 📱 Telegram
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_BTTS: ${{ secrets.TELEGRAM_GROUP_BTTS }}
          TELEGRAM_GROUP_OVER25: ${{ secrets.TELEGRAM_GROUP_OVER25 }}
          TELEGRAM_GROUP_COMBO: ${{ secrets.TELEGRAM_GROUP_COMBO }}
          TELEGRAM_GROUP_COMBOS: ${{ secrets.TELEGRAM_GROUP_COMBOS }}
          TELEGRAM_GROUP_BTTS_HT: ${{ secrets.TELEGRAM_GROUP_BTTS_HT }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          TELEGRAM_GROUP_HZ_LIVE: ${{ secrets.TELEGRAM_GROUP_HZ_LIVE }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          # 🗄️ Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # ⚙️ Settings
          MAX_LEAGUES_PER_RUN: "25"
          APIFOOTBALL_INJURIES: "true"
          APIFOOTBALL_TEAM_STATS: "true"
          APIFOOTBALL_H2H: "true"
          APIFOOTBALL_PREDICTIONS: "true"
          APIFOOTBALL_MAX_CALLS: "150"
          AI_SLEEP_SECONDS: "2.0"
          MIN_PROBABILITY: "67"
          MIN_CONFIDENCE: "3"
          MIN_VALUE_RATING: "OK"
          LEAGUE_ROTATION_ENABLED: "true"
          LEAGUE_ROTATION_MIN_SAMPLES: "5"
          LEAGUE_ROTATION_MIN_QUOTE: "0.50"
          LEAGUE_ROTATION_MAX_QUOTE: "0.70"
          ENABLE_CORNERS_SCORER: "true"
        run: python btts_bot.py
      - name: Done
        if: always()
        run: echo "✅ Tips Bot Complete"
