name: NETRATTLER SportScore Public API Sandbox
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/netrattler_sportscore_probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_TOKEN: ''
      SUPABASE_URL: ''
      LMG_SEND: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary requests
      - name: Strict SportScore offline parser and identity Hardtest
        run: python -m unittest -v test_netrattler_lmg_sportscore.py
      - name: Production-style read-only SportScore coverage audit
        run: python netrattler_lmg_sportscore_probe.py
      - name: Probe publicly documented SportScore football discovery endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          url="https://sportscore.com/api/widget/matches/?sport=football&limit=50"
          req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"NETRATTLER-SportScore-ReadOnly-Research/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  status=r.status
                  payload=json.load(r)
          except urllib.error.HTTPError as e:
              print("SPORTSCORE_API_STATUS",e.code)
              raise SystemExit(2)
          except (urllib.error.URLError,ValueError,TimeoutError) as e:
              print("SPORTSCORE_PROBE_ERROR",type(e).__name__)
              raise SystemExit(3)
          if not isinstance(payload,dict):
              print("SPORTSCORE_BAD_SCHEMA")
              raise SystemExit(4)
          rows=payload.get("matches")
          print("SPORTSCORE_API_STATUS",status)
          print("SPORTSCORE_ROOT_KEYS",sorted(payload.keys())[:30])
          print("SPORTSCORE_MATCHES",len(rows) if isinstance(rows,list) else "none")
          if isinstance(rows,list):
              print("SPORTSCORE_MATCH_KEYS",sorted(set().union(*(set(x.keys()) for x in rows[:5] if isinstance(x,dict))))[:55])
              print("SPORTSCORE_STATUSES",sorted({str(x.get("status"))[:22] for x in rows if isinstance(x,dict)})[:15])
              for x in rows[:2]:
                  if isinstance(x,dict):
                      print("SPORTSCORE_SAMPLE_SHAPE",json.dumps({k:type(v).__name__ for k,v in x.items()},sort_keys=True)[:1100])
          PY
