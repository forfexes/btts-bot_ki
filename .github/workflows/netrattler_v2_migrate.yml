name: NETRATTLER V2 migrate (copy only)
on:
  schedule:
    - cron: "30 3 * * *"  # 05:30 CH — daily odds_history rotation (archive older-than-3-days rows to V2, then delete from main)
  workflow_dispatch:
    inputs:
      mode:
        description: check | schema | copy | verify
        default: check
      tables:
        description: comma list
        default: player_game_log,player_match_stats,odds_history
      target:
        description: v2, v3 or v4
        default: v2
      dry_run:
        description: true or false (rotate only)
        default: "true"
      hot_days:
        description: Tage im Hauptspeicher behalten
        default: "1"
      start_offset:
        default: "0"
concurrency:
  group: netrattler-v2-migrate
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests psycopg2-binary
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          V2_DATABASE_URL: ${{ secrets.V2_DATABASE_URL }}
          V3_DATABASE_URL: ${{ secrets.V3_DATABASE_URL }}
          HOT_DAYS: ${{ github.event.inputs.hot_days || (github.event_name == 'schedule' && '1') || '2' }}
          TARGET: ${{ github.event.inputs.target || (github.event_name == 'schedule' && 'v4') || 'v2' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false') || 'true' }}
          V4_DATABASE_URL: ${{ secrets.V4_DATABASE_URL }}
          V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
          V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'rotate') || 'check' }}
          TABLES: ${{ github.event.inputs.tables || 'player_game_log,player_match_stats,odds_history' }}
          START_OFFSET: ${{ github.event.inputs.start_offset }}
          V2_REST_URL: ${{ secrets.V2_SUPABASE_URL }}
          V2_REST_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
          MAX_SECONDS: "1800"
        run: python netrattler_v2_migrate.py
