name: NETRATTLER Offline Sandbox Hardtest
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'netrattler_premium_*.py'
      - 'netrattler_*card*.py'
      - 'test_netrattler_premium_all_cards.py'
      - 'assets/premium_*.svg'
  push:
    branches: [main]
    paths:
      - 'netrattler_premium_*.py'
      - 'netrattler_lmg_card.py'
      - 'netrattler_corner_template.py'
      - 'test_netrattler_premium_all_cards.py'
      - '.github/workflows/netrattler_offline_sandbox_hardtest.yml'
      - 'netrattler_premium_verified_cards.py'
      - 'netrattler_premium_compact.py'
      - 'netrattler_original_template_renderer.py'
      - 'netrattler_neon_design.py'
      - 'netrattler_stats_match_cards.py'
      - 'netrattler_builder_cards.py'
      - 'test_premium_verified_cards.py'
      - 'test_premium_blank_masters.py'
      - 'test_netrattler_original_templates.py'
permissions:
  contents: read
jobs:
  offline-hardtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      NETRATTLER_SANDBOX_HARDTEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated render dependencies
        run: python -m pip install --quiet pillow cairosvg pytest requests beautifulsoup4 python-dotenv numpy
      - name: Syntax-check actual card entrypoints
        run: python -m py_compile netrattler_premium_extra.py netrattler_premium_adapter_shared.py netrattler_lmg_card.py netrattler_corner_template.py netrattler_premium_verified_cards.py netrattler_premium_compact.py netrattler_original_template_renderer.py netrattler_neon_design.py netrattler_stats_match_cards.py netrattler_builder_cards.py
      - name: Test premium masters and 16-category verified render
        run: python -m unittest -v test_premium_blank_masters test_premium_verified_cards
      - name: Test actual Telegram renderers with mocked network
        run: python -m pytest -q test_netrattler_original_templates.py test_netrattler_corner_original.py test_netrattler_lmg_card.py test_netrattler_lmg_next_goal.py test_netrattler_combo_dynamic_cards.py test_netrattler_visual_review.py
      - name: PNG and visual regression tests for all 16 premium categories (offline, network blocked)
        run: python -m pytest -q test_netrattler_premium_all_cards.py
      - name: Audit actual premium production route (no unconditional failure)
        run: |
          python - <<'PY'
          import inspect
          import netrattler_stats_match_cards as stats
          import netrattler_premium_telegram_adapter as adapter
          import netrattler_builder_cards as builder
          import netrattler_neon_design as design
          from netrattler_premium_verified_cards import render_verified_png
          source=inspect.getsource(stats.render_card)
          assert 'netrattler_premium_telegram_adapter' in source, 'Ordinary premium route missing'
          assert 'crest_provider=_badge_bytes' in source, 'Real crest provider not wired'
          assert 'NETRATTLER_CARD_LAYOUT' in source, 'Explicit legacy override not guarded'
          assert callable(adapter.render) and callable(render_verified_png)
          assert 'netrattler_original_template_renderer' in inspect.getsource(design.render_builder_card)
          assert 'netrattler_original_template_renderer' in inspect.getsource(design.render_scorer_card)
          from netrattler_original_template_renderer import _builder_canvas
          from netrattler_premium_compact import compact_master
          from PIL import Image
          import io
          for n in (2, 3, 4, 5, 6):
              canvas, shift = _builder_canvas([None] * n)
              assert canvas.size == (1122, 1402 - 100 * (6 - n))
              assert shift == -100 * (6 - n)
              assert compact_master('builder', n)
          print('PASS: old Builder entrypoint uses new premium SVG masters for 2–6 legs')
          print('PASS: ordinary single-market production cards route to premium adapter')
          print('NOTICE: Builder and Goal Hunter use separate original-template renderers; tested separately')
          PY
      - name: Fail if compact Builder footer overlaps selection rows
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          from netrattler_premium_compact import compact_master
          from netrattler_original_template_renderer import render_builder
          import inspect
          source=inspect.getsource(render_builder)
          assert 'footer_y = 1185 + shift' in source
          assert 'y0=1034+f' not in source
          ns='{http://www.w3.org/2000/svg}'
          for n in range(2,7):
              root=ET.fromstring(compact_master('builder',n))
              rects=[x for x in root.findall(ns+'rect') if x.get('x')=='42' and x.get('width')=='1038']
              rows=[x for x in rects if float(x.get('height'))<120]
              footer=[x for x in rects if float(x.get('height'))>=120]
              assert len(rows)==n and len(footer)==1
              last=max(float(x.get('y'))+float(x.get('height')) for x in rows)
              assert last<float(footer[0].get('y')), f'Builder {n}: footer overlaps rows'
          print('PASS: 2–6 leg premium footer is below all selection rows')
          PY
      - name: Create visual sandbox PNG artifact (never send to Telegram)
        if: always()
        run: |
          mkdir -p sandbox-qa
          python - <<'PY'
          from pathlib import Path
          from netrattler_premium_verified_cards import CATEGORIES, render_verified_png
          leg={'match':'TEST HOME vs TEST AWAY','market':'TEST MARKET',
               'bookmaker_odds':2.15,'bookmaker':'offline_test_fixture'}
          for category in CATEGORIES:
              count=3 if category in ('combo','builder') else 1
              Path('sandbox-qa/'+category+'_SANDBOX_ONLY.png').write_bytes(
                  render_verified_png(category,[leg.copy() for _ in range(count)]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-offline-hardtest-16-categories
          path: sandbox-qa/*.png
          if-no-files-found: warn
          retention-days: 7
