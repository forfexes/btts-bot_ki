name: Cleanup runs

on:
  schedule:
    - cron: '0 3 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs
        run: |
          gh run list --limit 1000 --json databaseId -q '.[].databaseId' | tail -n +50 | while read id; do
            gh run delete $id
          done
