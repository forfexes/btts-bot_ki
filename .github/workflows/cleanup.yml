name: Cleanup runs

on:
  schedule:
    - cron: '0 3 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      actions: write

    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Never spend the entire Actions budget on thousands of old runs.
          # Some protected runs return 403; log them but clean the rest.
          # Preserve settlement evidence and offline hardtests for audit/monitoring.
          # Select the same run positions as before, then exclude protected workflows.
          gh run list --repo "$GH_REPO" --limit 300 --json databaseId,workflowName |
            jq -r '.[49:129][] | select(.workflowName != "NETRATTLER Offline Sandbox Hardtest" and .workflowName != "NETRATTLER Settlement Final V25 MULTISOURCE") | .databaseId' |
            while read -r id; do
              if ! gh run delete "$id" --repo "$GH_REPO"; then
                echo "::warning::Run $id could not be removed (permissions/protection). Continuing cleanup."
              fi
            done
