name: NETRATTLER XXL Original-Integrity QA

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/netrattler_xxl_original_integrity_qa.yml"
      - "netrattler_settlement_v16_final.py"
      - "netrattler_stats_match_cards.py"
      - "netrattler_btts_owner_original.py"
      - "netrattler_builder_cards.py"
      - "netrattler_corner_cards.py"
      - "test_netrattler_settlement_v21.py"
      - "test_netrattler_premium_dispatch_gate.py"
      - "test_netrattler_scorer_card_result_identity.py"

permissions:
  contents: read

jobs:
  offline-original-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # A test must never trigger an actual Telegram edit or publication.
      TELEGRAM_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      STATS_MATCH_CARDS_SEND_DELAY_SEC: "0"
      CREST_PREFETCH_BUDGET_SEC: "0"
      SETTLEMENT_TG_EDIT_GAP_SEC: "0"
      SETTLEMENT_TG_ORIGINAL_EDIT_ONLY: "1"
      NETRATTLER_SANDBOX_HARDTEST: "1"
      NETRATTLER_ORIGINAL_ONLY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hermetic image and settlement test dependencies
        run: python -m pip install --quiet pytest pillow requests cairosvg python-dateutil numpy scikit-learn
      - name: Compile premium card and settlement routes
        run: |
          python -m py_compile netrattler_settlement_v16_final.py netrattler_stats_match_cards.py
          python -m py_compile netrattler_btts_owner_original.py netrattler_builder_cards.py netrattler_corner_cards.py
      - name: Verify no truncated originals, duplicate sends or unapproved art
        run: |
          python test_netrattler_settlement_v21.py
          python -m pytest -q test_netrattler_premium_dispatch_gate.py test_netrattler_scorer_card_result_identity.py
      - name: Assert real production uses owner-only gate and caption-only fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          tips = Path(".github/workflows/btts_tips.yml").read_text(encoding="utf-8")
          settle = Path(".github/workflows/netrattler_settlement_v16_final.yml").read_text(encoding="utf-8")
          assert 'NETRATTLER_ORIGINAL_ONLY:   "1"' in tips
          assert 'SETTLEMENT_TG_ORIGINAL_EDIT_ONLY: "1"' in settle
          print("PREMIUM ORIGINAL-ONLY & NO-OVERPAINT SETTLEMENT GATES PRESENT")
          print("OFFLINE TEST ONLY: no secrets, no Telegram messages, no database mutations")
          PY
