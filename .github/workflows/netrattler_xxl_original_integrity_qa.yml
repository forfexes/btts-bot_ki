name: NETRATTLER XXL Original-Integrity QA

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/netrattler_xxl_original_integrity_qa.yml"
      - "netrattler_settlement_v16_final.py"
      - "netrattler_stats_match_cards.py"
      - "netrattler_btts_owner_original.py"
      - "netrattler_builder_cards.py"
      - "netrattler_corner_cards.py"
      - "test_netrattler_settlement_v21.py"
      - "test_netrattler_premium_dispatch_gate.py"
      - "test_netrattler_scorer_card_result_identity.py"
      - "netrattler_clean_card_renderer.py"
      - "netrattler_clean_master_builder.py"
      - "test_netrattler_clean_card_renderer.py"
      - "test_netrattler_clean_master_builder.py"
      - "netrattler_five_owner_reference_qa.py"
      - "test_netrattler_five_owner_reference_qa.py"
      - "netrattler_original_release_inventory.py"
      - "test_netrattler_original_release_inventory.py"

permissions:
  contents: read

jobs:
  offline-original-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # A test must never trigger an actual Telegram edit or publication.
      TELEGRAM_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      STATS_MATCH_CARDS_SEND_DELAY_SEC: "0"
      CREST_PREFETCH_BUDGET_SEC: "0"
      SETTLEMENT_TG_EDIT_GAP_SEC: "0"
      SETTLEMENT_TG_ORIGINAL_EDIT_ONLY: "1"
      NETRATTLER_SANDBOX_HARDTEST: "1"
      # Offline regression fixtures can exercise legacy render paths without
      # granting production approval or sending Telegram photos.
      NETRATTLER_BLOCK_OVERPAINTED_MASTERS: "0"
      NETRATTLER_ORIGINAL_ONLY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hermetic image and settlement test dependencies
        run: python -m pip install --quiet pytest pillow requests cairosvg python-dateutil numpy scikit-learn
      - name: Compile premium card and settlement routes
        run: |
          python -m py_compile netrattler_settlement_v16_final.py netrattler_stats_match_cards.py
          python -m py_compile netrattler_btts_owner_original.py netrattler_builder_cards.py netrattler_corner_cards.py
      - name: Verify no truncated originals, duplicate sends or unapproved art
        run: |
          python test_netrattler_settlement_v21.py
          python -m pytest -q test_netrattler_premium_dispatch_gate.py test_netrattler_scorer_card_result_identity.py
      - name: Offline ten original-derived blank/dynamic cards, no fake crests or prices
        env:
          NETRATTLER_CARD_QA_PREVIEW_DIR: output/netrattler_ten_sandbox
        run: |
          python -m py_compile netrattler_clean_master_builder.py netrattler_clean_card_renderer.py test_netrattler_clean_card_renderer.py
          python -m pytest -q test_netrattler_clean_master_builder.py test_netrattler_clean_card_renderer.py
          echo "ALL TEN WATERMARKED QA PREVIEWS ONLY: no Telegram and no release approval"
      - name: Upload only unapproved, watermarked source-derived previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NETRATTLER-TEN-SANDBOX-NOT-OWNER-APPROVED
          path: output/netrattler_ten_sandbox/*_SANDBOX_NOT_APPROVED.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Offline five additional genuine owner-reference clean masters
        env:
          TELEGRAM_BOT_TOKEN: ""
          SUPABASE_URL: ""
        run: |
          python -m pytest -q test_netrattler_five_owner_reference_qa.py
          python -m pytest -q test_netrattler_original_release_inventory.py
          python netrattler_original_release_inventory.py --json > output/netrattler_qa_inventory.json
          python netrattler_five_owner_reference_qa.py --outdir output/netrattler_five_owner_qa
          echo "FIVE SOURCE-DERIVED DRAFTS ONLY: no Telegram release"
      - name: Export five owner-derived drafts for human pixel review
        uses: actions/upload-artifact@v4
        with:
          name: NETRATTLER-FIVE-ORIGINAL-SOURCES-NOT-APPROVED
          path: output/netrattler_five_owner_qa/*_SOURCE_DERIVED_SANDBOX.png
          if-no-files-found: error
          retention-days: 3
      - name: Export user-original clean-frame source backgrounds for offline pixel QA
        uses: actions/upload-artifact@v4
        with:
          name: NETRATTLER-SOURCE-BACKGROUNDS-QA-NOT-PRODUCTION
          path: |
            assets/goal_hunter_neon_frame.webp
            assets/goal_hunter_original_header.webp
            assets/netrattler_template_corner_original.webp
            assets/original_templates/NETRATTLER_BTTS_originalkarte.png
          retention-days: 1
      - name: Assert real production uses owner-only gate and caption-only fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          tips = Path(".github/workflows/btts_tips.yml").read_text(encoding="utf-8")
          settle = Path(".github/workflows/netrattler_settlement_v16_final.yml").read_text(encoding="utf-8")
          assert 'NETRATTLER_ORIGINAL_ONLY:   "1"' in tips
          assert 'NETRATTLER_BLOCK_OVERPAINTED_MASTERS: "1"' in tips
          assert 'SETTLEMENT_TG_ORIGINAL_EDIT_ONLY: "1"' in settle
          print("PREMIUM ORIGINAL-ONLY & NO-OVERPAINT SETTLEMENT GATES PRESENT")
          print("OFFLINE TEST ONLY: no secrets, no Telegram messages, no database mutations")
          PY
