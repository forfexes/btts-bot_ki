name: NETRATTLER Settlement Final V21 + V36 AutoLearning

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3,7,11,15,19,23 * * *"

concurrency:
  group: netrattler-settlement-v36
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests numpy scikit-learn
      - run: python -m py_compile netrattler_settlement_v16_final.py netrattler_learning_engine.py netrattler_autolearn_v36.py netrattler_builder_learning_v36.py
      - name: Settle per group and learn from newly closed picks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_BTTS: ${{ secrets.TELEGRAM_GROUP_BTTS }}
          TELEGRAM_GROUP_OVER25: ${{ secrets.TELEGRAM_GROUP_OVER25 }}
          TELEGRAM_GROUP_COMBO: ${{ secrets.TELEGRAM_GROUP_COMBO }}
          TELEGRAM_GROUP_COMBOS: ${{ secrets.TELEGRAM_GROUP_COMBOS }}
          TELEGRAM_GROUP_BTTS_HT: ${{ secrets.TELEGRAM_GROUP_BTTS_HT }}
          TELEGRAM_GROUP_OVER15_HT: ${{ secrets.TELEGRAM_GROUP_OVER15_HT }}
          TELEGRAM_GROUP_BUILDER: ${{ secrets.TELEGRAM_GROUP_BUILDER }}
          TELEGRAM_GROUP_PROPS: ${{ secrets.TELEGRAM_GROUP_PROPS }}
          TELEGRAM_GROUP_CORNERS: ${{ secrets.TELEGRAM_GROUP_CORNERS }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          NETRATTLER_AUTO_LEARN_AFTER_SETTLEMENT: "true"
          UPDATE_SOURCE_TIPS: "true"
          SEND_PENDING_SUMMARY: "false"
        run: python netrattler_settlement_v16_final.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-v36-settlement-learning
          path: |
            netrattler_active_policy.json
            netrattler_autolearn_registry.json
            netrattler_autolearn_report.json
            netrattler_builder_correlations.json
          if-no-files-found: ignore
