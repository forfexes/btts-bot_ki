name: NETRATTLER Settlement Final V25 MULTISOURCE

on:
  workflow_dispatch:
  # Changing the settlement workflow triggers one guarded production
  # verification. Ordinary code commits do NOT spam live Telegram groups.
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_settlement_v16_final.yml'
  schedule:
    - cron: "20 13 * * *"
    - cron: "20 23 * * *"

concurrency:
  group: netrattler-prod-settlement
  cancel-in-progress: false

jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary requests python-dateutil numpy scikit-learn pillow
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1 || true
      - name: Compile settlement + learning feedback
        run: |
          python -m py_compile netrattler_settlement_v16_final.py netrattler_settlement_runner.py \
            netrattler_result_enrichment.py test_netrattler_result_enrichment.py test_netrattler_settlement_v21.py test_netrattler_settlement_runner.py \
            netrattler_learning_engine.py netrattler_autolearn_v36.py \
            netrattler_builder_learning_v36.py netrattler_runtime_policy.py
      - name: Settlement regression
        run: |
          python test_netrattler_settlement_v21.py
          python test_netrattler_result_enrichment.py
          python test_netrattler_settlement_runner.py
          python test_settlement_lenient_match.py
      - name: Pending tips result backfill (FotMob days + HT)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_pending_result_backfill.py
      - name: ESPN half-time backfill
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_espn_ht_backfill.py
      - name: Run Settlement V25 MULTISOURCE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_BTTS: ${{ secrets.TELEGRAM_GROUP_BTTS }}
          TELEGRAM_GROUP_OVER25: ${{ secrets.TELEGRAM_GROUP_OVER25 }}
          TELEGRAM_GROUP_COMBO: ${{ secrets.TELEGRAM_GROUP_COMBO }}
          TELEGRAM_GROUP_COMBOS: ${{ secrets.TELEGRAM_GROUP_COMBOS }}
          TELEGRAM_GROUP_BTTS_HT: ${{ secrets.TELEGRAM_GROUP_BTTS_HT }}
          TELEGRAM_GROUP_OVER15_HT: ${{ secrets.TELEGRAM_GROUP_OVER15_HT }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          TELEGRAM_GROUP_BUILDER: ${{ secrets.TELEGRAM_GROUP_BUILDER }}
          TELEGRAM_GROUP_PROPS: ${{ secrets.TELEGRAM_GROUP_PROPS }}
          TELEGRAM_GROUP_PLAYER_PROPS: ${{ secrets.TELEGRAM_GROUP_PLAYER_PROPS }}
          TELEGRAM_GROUP_CORNERS: ${{ secrets.TELEGRAM_GROUP_CORNERS }}
          TELEGRAM_GROUP_HZ_LIVE: ${{ secrets.TELEGRAM_GROUP_HZ_LIVE }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          ALLSPORTS_API_KEY: ${{ secrets.ALLSPORTS_API_KEY }}
          FOOTBALL_DATA_API_KEYS: ${{ secrets.FOOTBALL_DATA_API_KEYS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALLDATA_IO_API_KEY: ${{ secrets.FOOTBALLDATA_IO_API_KEY }}
          SETTLEMENT_DAYS: "45"
          SETTLEMENT_LIMIT: "12000"
          RESULT_USE_SOFASCORE: "false"
          RESULT_USE_ESPN: "true"
          RESULT_USE_OPENLIGADB: "true"
          RESULT_HTTP_TIMEOUT: "4"
          ESPN_DISABLE_AFTER_FORBIDDEN: "true"
          RESULT_USE_FOTMOB: "true"
          RESULT_USE_SOFASCORE_DETAIL: "true"
          RESULT_ENRICH_MAX_DETAILS: "120"
          RESULT_ENRICH_TIMEOUT: "7"
          SETTLEMENT_ALLOW_SEPARATE_RESULT_UPDATE: "false"
          # Retry 429 edits with throttling, then restore missed original posts.
          SETTLEMENT_TG_EDIT_GAP_SEC: "1.5"
          SETTLEMENT_TG_REPLAY_DAYS: "4"
          SETTLEMENT_TG_REPLAY_MAX: "50"
        run: python netrattler_settlement_runner.py
      - name: Learn immediately from newly settled picks
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NETRATTLER_LEARNING_MODE: "learning"
        run: python netrattler_learning_engine.py

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_game_log,player_match_stats
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
