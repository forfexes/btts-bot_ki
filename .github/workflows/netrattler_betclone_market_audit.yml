name: NETRATTLER Bookie Market Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_betclone_market_audit.yml'
      - 'netrattler_betclone_market_audit.py'
      - 'test_netrattler_betclone_market_audit.py'
  schedule:
    - cron: '12 8 * * *'
permissions:
  contents: read
jobs:
  inspect-public-market-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Test market-audit parser without external requests
        run: python -m unittest -v test_netrattler_betclone_market_audit.py
      - name: Inspect existing public market feeds (read-only)
        run: python netrattler_betclone_market_audit.py --timeout 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-betclone-market-audit
          path: netrattler_betclone_market_audit.json
          retention-days: 7
