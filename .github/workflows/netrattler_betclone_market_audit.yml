# Schedule removed 2026-10-17: BetClone investigation finished (see BETCLONE_STATUS.md); saves Actions minutes. Run by hand via workflow_dispatch.
name: NETRATTLER Bookie Market Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-market-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Test market-audit parser without external requests
        run: python -m unittest -v test_netrattler_betclone_market_audit.py
      - name: Test production odds fallback and safe source gating
        run: python test_netrattler_odds_cache_guard.py
      - name: Verify production Supabase odds fallback (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          import netrattler_odds_cache_guard as cache
          if not os.getenv("SUPABASE_URL") or not os.getenv("SUPABASE_KEY"):
              raise SystemExit("Missing Supabase read configuration")
          rows = cache._load_rows(force=True)
          counts = Counter(str(row.get("source") or "") for row in rows)
          print("VERIFIED_ODDS_FALLBACK total=", len(rows), "sources=", dict(counts), flush=True)
          if counts.get("bwin", 0) <= 0:
              raise SystemExit("Live validated bwin odds not returned by fallback query")
          if any(str(row.get("source")) not in cache.LIVE_HISTORY_SOURCES for row in rows):
              raise SystemExit("Non-validated bookmaker escaped the source gate")
          PY
      - name: Test BetClone live corroboration rules
        run: python -m unittest -v test_netrattler_betclone_live_smoke.py
      - name: Measure today's actually corroborated 1xBet markets (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python netrattler_betclone_live_smoke.py
      - name: Inspect existing public market feeds (read-only)
        run: python netrattler_betclone_market_audit.py --timeout 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-betclone-market-audit
          path: netrattler_betclone_market_audit.json
          retention-days: 7

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
