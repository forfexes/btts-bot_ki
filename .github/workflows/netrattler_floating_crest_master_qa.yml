name: NETRATTLER Floating Original Crests - Full Offline QA
"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "last_minute_owner_20261122/build_master.py"
      - "last_minute_owner_20261122/last_minute_dynamic_card.py"
      - "last_minute_owner_20261122/test_last_minute_dynamic_card.py"
      - "netrattler_stats_match_cards.py"
      - "netrattler_premium_telegram_adapter.py"
      - "test_netrattler_premium_floating_crest_adapter.py"
      - "test_netrattler_floating_crests_all_cards.py"
      - ".github/workflows/netrattler_floating_crest_master_qa.yml"
permissions:
  contents: write
concurrency:
  group: netrattler-floating-original-crests
  cancel-in-progress: false
jobs:
  source-derived-no-sticker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      SUPABASE_URL: ""
      LMG_SEND: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated offline QA packages
        run: python -m pip install --quiet 'Pillow>=10' 'opencv-python-headless>=4.8' 'numpy>=1.24,<3' requests pytest
      - name: Compile and rebuild the clean floating-crest Last Minute Goal master
        run: |
          python -m py_compile last_minute_owner_20261122/build_master.py last_minute_owner_20261122/last_minute_dynamic_card.py netrattler_stats_match_cards.py
          python last_minute_owner_20261122/build_master.py
      - name: Test authentic logo transparency and actual owner artwork OFFLINE
        run: |
          python -m unittest -v last_minute_owner_20261122.test_last_minute_dynamic_card
          python -m unittest -v test_netrattler_floating_crests_all_cards
          python -m unittest -v test_netrattler_premium_floating_crest_adapter
      - name: Save source-derived clean plate after checks pass
        run: |
          git add last_minute_owner_20261122/last_minute_clean_plate.png
          if git diff --cached --quiet; then
            echo "The clean owner plate is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save ring-free original NETRATTLER Last Minute clean master"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Export original, derived clean master and example for visual signoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-floating-original-crest-qa
          path: |
            last_minute_owner_20261122/last_minute_user_original.png
            last_minute_owner_20261122/last_minute_clean_plate.png
            last_minute_owner_20261122/last_minute_render_test.png
          if-no-files-found: warn
          retention-days: 7
