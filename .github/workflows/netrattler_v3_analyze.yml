name: NETRATTLER V3 Statistics Maintenance
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_v3_analyze.yml'
permissions:
  contents: read
concurrency:
  group: netrattler-v3-maintenance
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary psycopg2-binary requests
      - name: Update PostgreSQL planner stats only (never delete rows)
        env:
          TARGET: v3
          V3_DATABASE_URL: ${{ secrets.V3_DATABASE_URL }}
        run: |
          python - <<'PY'
          import netrattler_v2_migrate as db

          if not db.DST_DSN.startswith(("postgres://", "postgresql://")):
              raise SystemExit("NETRATTLER V3 DSN missing")
          conn = db.dst()
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT relname FROM pg_stat_user_tables
                      WHERE schemaname='public'
                        AND relname IN ('odds_history', 'netrattler_data_lake_raw',
                                        'netrattler_match_history')
                  """)
                  tables = [name for name, in cur.fetchall()]
                  if 'odds_history' not in tables:
                      raise SystemExit("V3 odds_history missing: no operation")
                  before = conn.cursor()
                  before.execute("SELECT pg_database_size(current_database())")
                  before_bytes = before.fetchone()[0]
                  before.close()
                  for name in sorted(tables):
                      # Fixed whitelist, no user input; ANALYZE updates statistics
                      # but neither deletes rows nor rewrites the 162 MiB index.
                      cur.execute('ANALYZE public.' + name)
                      print("ANALYZED", name)
                  cur.execute("""
                      SELECT relname, n_live_tup, n_dead_tup, last_analyze
                      FROM pg_stat_user_tables
                      WHERE schemaname='public' AND relname IN
                            ('odds_history','netrattler_data_lake_raw','netrattler_match_history')
                      ORDER BY relname
                  """)
                  for name, live, dead, analyzed in cur.fetchall():
                      print(f"V3 STATS {name}: live_est={live} dead_est={dead} analyzed={'yes' if analyzed else 'no'}")
                  cur.execute("SELECT pg_database_size(current_database())")
                  after_bytes = cur.fetchone()[0]
                  print(f"NETRATTLER V3 STORAGE: before_mib={before_bytes/1048576:.2f}"
                        f" after_mib={after_bytes/1048576:.2f}")
          finally:
              conn.close()
          PY
