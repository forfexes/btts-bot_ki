name: NETRATTLER API-Football Source Audit
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary requests pillow
      - env:
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          FOOTBALL_DATA_API_KEYS: ${{ secrets.FOOTBALL_DATA_API_KEYS }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          ALLSPORTS_API_KEY: ${{ secrets.ALLSPORTS_API_KEY }}
          SPORTDB_API_KEY: ${{ secrets.SPORTDB_API_KEY }}
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_source_audit.py
