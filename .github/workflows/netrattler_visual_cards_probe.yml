name: NETRATTLER Visual Cards Source Check
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_visual_cards_probe.yml'
      - 'netrattler_corner_cards.py'
      - 'netrattler_corner_template.py'
      - 'assets/netrattler_template_corner_original.webp'
      - 'test_netrattler_corner_original.py'
      - 'netrattler_stats_match_cards.py'
      - 'test_netrattler_ai_match_card_design.py'
      - 'netrattler_builder_cards.py'
      - 'netrattler_neon_design.py'
      - 'netrattler_original_template_renderer.py'
      - 'assets/netrattler_template_builder_original.webp'
      - 'assets/netrattler_template_goal_original.webp'
      - 'netrattler_visual_review.py'
      - 'netrattler_card_visual_preview.py'
      - 'test_netrattler_original_templates.py'
      - 'test_netrattler_visual_cards.py'
      - 'test_netrattler_visual_review.py'
      - 'netrattler_visual_gate.py'
      - 'netrattler_commons_inventory.py'
      - 'netrattler_commons_photos.py'
      - 'test_netrattler_commons_inventory.py'
      - 'test_netrattler_commons_photos.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary requests pillow cairosvg pytest
      - run: python -m pytest -q test_netrattler_visual_cards.py test_netrattler_commons_inventory.py test_netrattler_commons_photos.py
      - name: Normal NETRATTLER AI match-card template regression
        run: python -m pytest -q test_netrattler_ai_match_card_design.py
      - name: Pixel-level visual PNG regression tests
        run: python -m pytest -q test_netrattler_visual_review.py
      - name: Original template and mocked Telegram transport integration
        run: python -m pytest -q test_netrattler_original_templates.py
      - name: NETRATTLER AI Corner Sniper original and Telegram transport
        run: python -m pytest -q test_netrattler_corner_original.py
      - name: Render 2/4/6-leg Builder and Goal Hunter PNG previews
        run: python netrattler_card_visual_preview.py --outdir visual_review_previews
      - name: Publish image previews and visual QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-visual-qa-previews
          path: visual_review_previews/
          retention-days: 7
      - name: Read-only H2H and club crest check
        env:
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          CARD_H2H_MAX_CALLS: '8'
        run: |
          python - <<'PY'
          import io,json,requests
          from PIL import Image
          import netrattler_stats_match_cards as cards
          tip={'match':'Millwall vs Derby County','league':'England - Championship'}
          cards.attach_h2h_api({'corners':[tip]})
          logos={}
          for team in ('Millwall','Derby County'):
              url=cards._apifootball_logo(team,'England - Championship')
              ok=False
              if url:
                  r=requests.get(url,timeout=12)
                  if r.ok:
                      Image.open(io.BytesIO(r.content)).verify()
                      ok=True
              logos[team]=ok
          print(json.dumps({'probe':'visual_cards_sources','h2h_matches':tip.get('h2h_matches',0),
                            'h2h_avg_goals':tip.get('h2h_avg_goals'), 'downloaded_crests':logos,
                            'team_ids':cards._AF_TEAM_ID, 'api_calls':cards.STATS.get('h2h_api_calls',0)}))
          assert tip.get('h2h_matches',0)>0, 'Expected covered historical head-to-head fixtures missing'
          assert all(logos.values()), 'Expected club crests unavailable'
          PY
