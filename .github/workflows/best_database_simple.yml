name: NETRATTLER Best Database Simple
on:
  workflow_dispatch:
    inputs:
      run_main_bot:
        description: "Run btts_bot.py afterwards?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  # Auto-Schedule deaktiviert: Workflow produzierte nichts (No-Op), lief 6x/Tag.
  # Bei Bedarf manuell ueber "Run workflow" startbar.
  # schedule:
  #   - cron: "23 */4 * * *"
jobs:
  best-database-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOCIAL_SIGNAL_CSV_URL: ${{ secrets.SOCIAL_SIGNAL_CSV_URL }}
      NETRATTLER_SIGNAL_QUERIES: ${{ secrets.NETRATTLER_SIGNAL_QUERIES }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
      FOOTBALL_DATA_API_KEYS: ${{ secrets.FOOTBALL_DATA_API_KEYS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_GROUP_BTTS: ${{ secrets.TELEGRAM_GROUP_BTTS }}
      TELEGRAM_GROUP_OVER25: ${{ secrets.TELEGRAM_GROUP_OVER25 }}
      TELEGRAM_GROUP_COMBO: ${{ secrets.TELEGRAM_GROUP_COMBO }}
      TELEGRAM_GROUP_COMBOS: ${{ secrets.TELEGRAM_GROUP_COMBOS }}
      TELEGRAM_GROUP_BTTS_HT: ${{ secrets.TELEGRAM_GROUP_BTTS_HT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests pandas numpy python-dateutil
      - name: Compile
        run: python -m py_compile netrattler_best_database_onefile.py
      - name: Run Best Database Onefile
        run: python netrattler_best_database_onefile.py
      - name: Run Main Bot if requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_main_bot == 'true' }}
        run: python btts_bot.py
