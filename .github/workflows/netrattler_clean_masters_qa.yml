name: NETRATTLER Clean Owner-Derived Masters QA
"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'netrattler_clean_master_builder.py'
      - 'test_netrattler_clean_master_builder.py'
      - '.github/workflows/netrattler_clean_masters_qa.yml'
permissions:
  contents: read
jobs:
  derived-clean-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated image dependencies
        run: python -m pip install 'Pillow>=10' 'pytest>=8'
      - name: Render ten source-derived clean masters (QA only)
        run: python -u netrattler_clean_master_builder.py --outdir output/clean-masters
      - name: Verify original crown, empty real-data slots and immutable assets
        run: python -m pytest -q test_netrattler_clean_master_builder.py
      - name: List non-production masters
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('output/clean-masters/manifest.json').read_text())
          assert len(rows)==10
          assert all(not row['production_approved'] for row in rows)
          print('Clean master count:',len(rows))
          assert all(item['logo_backplates'] is False for item in rows)
          assert 'last_minute_goal' not in {item['category'] for item in rows}
          print('Independent real Last Minute Goal owner plate is not borrowed from Corner Sniper')
          for row in rows:
              print(row['category'],row['source_file'],row['classification'])
          print('Synthetic QA only; Telegram not touched; source originals retained')
          PY
      - name: Assemble all 10 cards as visibly UNAPPROVED inline QA contact sheet
        run: |
          python - <<'PY'
          import base64,io,json
          from pathlib import Path
          from PIL import Image,ImageDraw
          folder=Path("output/clean-masters")
          manifest=json.loads((folder/"manifest.json").read_text())
          assert len(manifest)==10
          cw,ch=235,333
          sheet=Image.new("RGB",(cw*5,ch*2),(2,12,22))
          draw=ImageDraw.Draw(sheet)
          for i,meta in enumerate(manifest):
              raw=folder/(meta["category"]+"_CLEAN_DERIVED_QA.png")
              with Image.open(raw) as im:
                  thumb=im.convert("RGB")
                  thumb.thumbnail((225,283),Image.Resampling.LANCZOS)
              left=(i%5)*cw+5
              top=(i//5)*ch+17
              sheet.paste(thumb,(left,top))
              draw.text((left,top-14),meta["category"],fill=(255,221,126))
              draw.text((left,top+289),"QA • NICHT FREIGEGEBEN",fill=(255,165,90))
          sheet.save(folder/"ALL_10_QA_NOT_APPROVED.png")
          preview=io.BytesIO()
          sheet.save(preview,"JPEG",quality=65,optimize=True)
          print("NETRATTLER_DERIVED_INLINE_QA "+
                base64.b64encode(preview.getvalue()).decode("ascii"))
          PY
      - name: Publish clean master PNG previews and machine-readable slot manifest
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-10-owner-derived-clean-masters-QA
          path: output/clean-masters/*
          retention-days: 14
          if-no-files-found: error
