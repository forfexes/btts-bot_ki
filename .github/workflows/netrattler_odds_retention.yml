name: NETRATTLER Odds Retention
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: |
          python -m py_compile netrattler_odds_retention.py test_netrattler_odds_retention.py
          python -m unittest -v test_netrattler_odds_retention.py
      - name: Alte Live-Quoten (>20 Tage) loeschen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_odds_retention.py
