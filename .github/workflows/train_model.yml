name: NETRATTLER ML Train V20

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * *"
    - cron: "45 13 * * *"
    - cron: "45 20 * * *"
    - cron: "45 23 * * *"

concurrency:
  group: netrattler-ml-train
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile trainer
        run: python -m py_compile train_model.py

      - name: Train NETRATTLER model
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NETRATTLER_ML_MODEL: "netrattler_v16_ml"
          ML_TRAIN_LIMIT: "10000"
          ML_MIN_FEATURE_BETS: "5"
        run: python train_model.py
