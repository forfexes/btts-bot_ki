name: NETRATTLER ML Train V36 Temporal All Sources

on:
  workflow_dispatch:
    inputs:
      force:
        description: "1 = retrain even if inputs unchanged"
        default: "0"
  schedule:
    - cron: "20 5 * * *"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install train dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_train.txt
      - name: Compile
        run: python -m py_compile train_model.py netrattler_autolearn_v36.py netrattler_model_registry_v37.py
      - name: Offline ML tests (honest holdout, quality gate)
        run: |
          python test_train_honest_eval.py
          python test_model_quality.py
      - name: Train from all normalized source tables and bookmaker odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FD_START_YEAR: "2010"
          NETRATTLER_XGB_ESTIMATORS: "200"
          NETRATTLER_PLAYER_XGB_ESTIMATORS: "160"
          NETRATTLER_CALIBRATION_FOLDS: "2"
          NETRATTLER_RETRAIN_MIN_NEW_SAMPLES: "30"
          NETRATTLER_RETRAIN_MAX_AGE_DAYS: "3"
          NETRATTLER_FORCE_RETRAIN: ${{ github.event.inputs.force || '0' }}
        run: |
          python train_model.py
          python netrattler_autolearn_v36.py --train || true

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats,netrattler_match_history
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
