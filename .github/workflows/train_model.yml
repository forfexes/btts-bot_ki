name: NETRATTLER ML Train V16

on:
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * *"
    - cron: "45 13 * * *"
    - cron: "45 20 * * *"
    - cron: "45 23 * * *"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests python-dateutil
      - name: Train NETRATTLER V16 ML
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NETRATTLER_ML_MODEL: "netrattler_v16_ml"
          ML_TRAIN_LIMIT: "5000"
          ML_MIN_FEATURE_BETS: "2"
        run: python netrattler_train_model.py
