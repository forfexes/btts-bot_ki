name: NETRATTLER ML Train V36 Temporal All Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * 0"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install train dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_train.txt
      - name: Compile
        run: python -m py_compile train_model.py netrattler_autolearn_v36.py netrattler_model_registry_v37.py
      - name: Train from all normalized source tables and bookmaker odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FD_START_YEAR: "2010"
          NETRATTLER_XGB_ESTIMATORS: "200"
          NETRATTLER_PLAYER_XGB_ESTIMATORS: "160"
          NETRATTLER_CALIBRATION_FOLDS: "2"
          NETRATTLER_RETRAIN_MIN_NEW_SAMPLES: "75"
          NETRATTLER_RETRAIN_MAX_AGE_DAYS: "14"
        run: |
          python train_model.py
          python netrattler_autolearn_v36.py --train || true
