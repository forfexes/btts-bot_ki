name: NETRATTLER Premium Template Telegram Smoke
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_original_template_smoke.yml'
      - 'assets/premium_*_blank.svg'
      - 'netrattler_original_template_renderer.py'
      - 'test_premium_blank_masters.py'
      - 'netrattler_premium_compact.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests pillow cairosvg
      - name: Validate empty premium masters and non-overlapping rows
        run: python -m unittest -v test_premium_blank_masters
      - name: Generate visual QA PNGs (not betting tips)
        run: |
          mkdir -p premium-qa
          python - <<'PY'
          from pathlib import Path
          from netrattler_premium_compact import render_blank_preview
          for category, counts in (("combo", (3, 7, 10)), ("builder", (3, 4, 6))):
              for count in counts:
                  Path(f"premium-qa/{category}_{count}_EMPTY_PREVIEW.png").write_bytes(
                      render_blank_preview(category, count))
          PY
      - name: Upload six empty card previews for manual visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-premium-empty-previews
          path: premium-qa/*.png
          retention-days: 7
      - name: Authenticate bot, verify Builder group and optional private photo delivery
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BUILDER_CHAT: ${{ secrets.TELEGRAM_GROUP_BUILDER }}
          PROPS_CHAT: ${{ secrets.TELEGRAM_GROUP_PLAYER_PROPS }}
          STATS_CHAT: ${{ secrets.TELEGRAM_GROUP_STATS }}
          DEFAULT_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_CHAT: ${{ secrets.TELEGRAM_TEMPLATE_TEST_CHAT_ID }}
        run: |
          python - <<'PY'
          import io, os, sys
          import requests
          from PIL import Image, ImageDraw, ImageFont
          import cairosvg
          token = os.environ.get("TOKEN","")
          sources=("BUILDER_CHAT","PROPS_CHAT","STATS_CHAT","DEFAULT_CHAT")
          route=next(((name,os.environ[name]) for name in sources if os.environ.get(name)),None)
          group=route[1] if route else ""
          test = os.environ.get("TEST_CHAT","")
          endpoint = f"https://api.telegram.org/bot{token}/" if token else ""
          if token:
              me = requests.get(endpoint+"getMe",timeout=15).json()
              assert me.get("ok"), "Bot authentication failed"
              print("telegram_auth=OK")
          else:
              print("telegram_auth=SKIPPED (secret not configured)")
          if group and token:
              chat = requests.post(endpoint+"getChat", json={"chat_id":group},timeout=15).json()
              assert chat.get("ok"), "Configured Builder chat is inaccessible"
              print("builder_destination=VERIFIED via "+route[0])
          else:
              print("builder_destination=NOT_CONFIGURED")
          from pathlib import Path
          masters = sorted(Path("assets").glob("premium_*_blank.svg"))
          assert len(masters) == 16, f"Expected 16 premium masters, got {len(masters)}"
          assert all(b"@prophunter" in f.read_bytes() for f in masters), "Missing @prophunter footer"
          assert all(b"@netrattler" not in f.read_bytes() for f in masters), "Legacy footer found"
          for filename in map(str, masters):
              with Image.open(io.BytesIO(cairosvg.svg2png(url=filename))) as im:
                  im.verify()
              print(filename.split("/")[-1]+": OK")
          if not test or not token:
              print("premium_masters=16 VERIFIED")
              print("live_photo_test=SKIPPED (private TELEGRAM_TEMPLATE_TEST_CHAT_ID not configured)")
              sys.exit(0)
          # Only a clearly labeled design smoke goes to the separate private
          # test chat; never create fake picks in production channels.
          img = Image.open(io.BytesIO(cairosvg.svg2png(url="assets/premium_builder_blank.svg"))).convert("RGB")
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle((100,660,1020,785),radius=18,fill="#101C29",outline="#F9D342",width=6)
          fontpath="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font=ImageFont.truetype(fontpath,44)
          draw.text((235,695),"DESIGN-TEST  /  KEIN TIPP",fill="#FFE55C",font=font)
          blob = io.BytesIO()
          img.save(blob,"PNG")
          response = requests.post(endpoint+"sendPhoto",data={
              "chat_id":test,"caption":"NETRATTLER DESIGN-TEST – keine Wette, keine echten Tippdaten.",
              "disable_notification":"true"},
              files={"photo":("NETRATTLER_DESIGN_TEST.png",blob.getvalue(),"image/png")},
              timeout=25).json()
          assert response.get("ok") and response.get("result",{}).get("message_id"), "Private Telegram photo send failed"
          print("live_photo_test=SUCCESS (private test chat only)")
          PY
