name: Asset Coverage Audit (netrattler) - Read Only
"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "asset_coverage_audit.py"
      - "netrattler_stats_match_cards.py"
      - "netrattler_espn_photo.py"
      - "netrattler_reference_images.py"
      - "netrattler_crest_identity.py"
      - ".github/workflows/asset_coverage_audit.yml"
  schedule:
    - cron: '21 4 * * 0'

permissions:
  contents: read

concurrency:
  group: asset-coverage-audit-netrattler
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install --quiet requests==2.32.5 Pillow==11.3.0 numpy==2.3.2
      - name: Syntax gate, no Telegram
        run: python -m py_compile asset_coverage_audit.py
      - name: Inventory complete names and verify real images on prioritized samples
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          ALLSPORTS_API_KEY: ${{ secrets.ALLSPORTS_API_KEY }}
          ASSET_FULL_CHAIN_SAMPLE: '8'
          ASSET_MAX_PHOTOS: '80'
          ASSET_MAX_TEAMS: '100'
        run: python -u asset_coverage_audit.py --bot netrattler --max-photos 80 --max-teams 100
      - name: Upload private-data-minimized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-coverage-audit-netrattler
          path: diagnostics/asset_coverage_audit.json
          if-no-files-found: warn
          retention-days: 7
