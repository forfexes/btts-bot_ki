name: NETRATTLER V2 V3 Storage Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_archive_storage_audit.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '41 5 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        target: [v2, v3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary requests psycopg2-binary
      - name: Read-only database sizes
        env:
          TARGET: ${{ matrix.target }}
          V2_DATABASE_URL: ${{ secrets.V2_DATABASE_URL }}
          V3_DATABASE_URL: ${{ secrets.V3_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import netrattler_v2_migrate as archive

          target = os.environ["TARGET"]
          if not archive.DST_DSN.startswith(("postgres://", "postgresql://")):
              raise SystemExit(f"{target}: archive database DSN is not configured")
          conn = archive.dst()
          try:
              with conn.cursor() as cursor:
                  cursor.execute("SELECT pg_database_size(current_database())")
                  size_bytes = cursor.fetchone()[0]
                  size_mib = size_bytes / 1048576
                  print(f"NETRATTLER {target.upper()}: bytes={size_bytes}, MiB={size_mib:.2f}, percent_of_500_MiB={size_mib/5:.1f}%")
                  cursor.execute("""
                      SELECT c.relname, pg_total_relation_size(c.oid)
                      FROM pg_class c
                      JOIN pg_namespace n ON n.oid = c.relnamespace
                      WHERE n.nspname = 'public' AND c.relkind = 'r'
                      ORDER BY pg_total_relation_size(c.oid) DESC LIMIT 12
                  """)
                  for name, size in cursor.fetchall():
                      print(f"TABLE {name}: {size/1048576:.2f} MiB")
                  if size_mib >= 450:
                      print(f"WARNING: NETRATTLER {target.upper()} archive database >= 90% of 500 MiB")
                  summary = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summary:
                      with open(summary, "a", encoding="utf-8") as output:
                          output.write(f"### NETRATTLER {target.upper()}\n\n"
                                       f"Database: **{size_mib:.2f} MiB** (reference 500 MiB)\n\n")
          finally:
              conn.close()
          PY
