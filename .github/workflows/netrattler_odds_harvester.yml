name: NETRATTLER Odds Harvester V34

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_odds_harvester.yml'
      - 'netrattler_keyless_odds.py'
      - 'netrattler_odds_harvester.py'
      - 'netrattler_html_odds_scraper.py'
  schedule:
    - cron: "45 6,11,17 * * *"  # 3 daily refreshes ahead of main football tip windows (UTC)
    - cron: "35 3 * * 0"
  workflow_dispatch:
    inputs:
      history:
        description: "Auch historische Bookmaker-Quoten laden"
        required: false
        default: "false"

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install fast odds dependencies
        run: pip install requests
      - name: Install slow/history odds adapters only when required
        if: github.event.schedule == '35 3 * * 0' || github.event.inputs.history == 'true'
        run: |
          pip install -r requirements_all_source.txt
          pip install oddsharvester || pip install git+https://github.com/jordantete/OddsHarvester.git || true
          python -m playwright install chromium --with-deps
      - name: Compile
        run: python -m py_compile netrattler_odds_harvester.py netrattler_keyless_odds.py netrattler_html_odds_scraper.py
      - name: Test bookmaker odds parser and bounded detail fallback
        run: python -m unittest -v test_netrattler_betclone_market_audit.py
      - name: Collect Bet365 and every available bookmaker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          NETRATTLER_HTML_ODDS_URLS: ${{ vars.NETRATTLER_HTML_ODDS_URLS }}
          NETRATTLER_HTML_ODDS_HOSTS: ${{ vars.NETRATTLER_HTML_ODDS_HOSTS }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
          ENABLE_ODDSHARVESTER: "true"
          ODDS_API_MAX_SPORTS_PER_RUN: "3"
          ODDS_API_REGIONS: "eu"
          ENABLE_BET365_PUBLIC: "true"
          ODDS_HISTORY_START_YEAR: "2010"
          ODDS_SLOW_FALLBACK_MIN_ROWS: "500"
          ODDSHARVESTER_TIMEOUT: "150"
          BET365_WAIT_MS: "5000"
          ODDS_ALLOW_SLOW_SOURCES: ${{ (github.event.schedule == '35 3 * * 0' || github.event.inputs.history == 'true') && 'true' || 'false' }}
        run: |
          if [ "${{ github.event.schedule }}" = "35 3 * * 0" ] || [ "${{ github.event.inputs.history }}" = "true" ]; then
            python netrattler_odds_harvester.py --all --start-year 2010
          else
            python netrattler_odds_harvester.py --live
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-odds-snapshot
          path: netrattler_odds_snapshot.json
          if-no-files-found: ignore

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
