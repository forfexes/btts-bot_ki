name: NETRATTLER Post-Run Check
on:
  workflow_run:
    workflows:
      - NETRATTLER AI Tipp Bot
      - NETRATTLER Bookie Market Audit
      - NETRATTLER BetClone Platform Probe
      - NETRATTLER Odds Harvester V34
      - NETRATTLER All Source Harvester V34
      - NETRATTLER Player Stats + Results Scraper V34
      - NETRATTLER ML Train V36 Temporal All Sources
      - NETRATTLER Scorer Source Probe
      - NETRATTLER Keyless Source Probe
      - NETRATTLER V36D MANUAL SOURCE LEARNING
      - NETRATTLER Settlement Final V25 MULTISOURCE
      - NETRATTLER Health Check
      - NETRATTLER Core CI
      - NETRATTLER Public Sources CI
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_post_run_check.yml'
      - 'netrattler_post_run_check.py'
      - 'test_netrattler_post_run_check.py'
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test post-run evaluation
        run: python -m unittest -v test_netrattler_post_run_check.py
      - name: Evaluate completed run and notify failures
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
        run: python netrattler_post_run_check.py
