name: NETRATTLER Core CI

on:
  push:
    branches: [main]
    paths:
      - "netrattler_runtime_patch.py"
      - "netrattler_odds_cache_guard.py"
      - "netrattler_kambi_team_odds.py"
      - "netrattler_aiscore.py"
      - "netrattler_free_odds.py"
      - "netrattler_prop_sources.py"
      - "test_netrattler_runtime_patch.py"
      - "test_netrattler_odds_cache_guard.py"
      - "test_netrattler_kambi_team_odds.py"
      - "test_netrattler_aiscore.py"
      - ".github/workflows/netrattler_ci.yml"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lean test dependencies
        run: python -m pip install --prefer-binary requests beautifulsoup4 cloudscraper curl_cffi
      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            netrattler_runtime_patch.py \
            netrattler_odds_cache_guard.py \
            netrattler_kambi_team_odds.py \
            netrattler_aiscore.py \
            netrattler_free_odds.py \
            netrattler_prop_sources.py \
            test_netrattler_runtime_patch.py \
            test_netrattler_odds_cache_guard.py \
            test_netrattler_kambi_team_odds.py \
            test_netrattler_aiscore.py
      - name: Runtime fallback and skip tests
        run: python test_netrattler_runtime_patch.py
      - name: Multi-brand Kambi tests
        run: python test_netrattler_kambi_team_odds.py
      - name: Fresh odds cache tests
        run: python test_netrattler_odds_cache_guard.py
      - name: AiScore parser tests
        run: python test_netrattler_aiscore.py
