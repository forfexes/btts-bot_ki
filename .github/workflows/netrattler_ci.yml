name: NETRATTLER Core CI

on:
  push:
    branches: [main]
    paths:
      - "netrattler_runtime_patch.py"
      - "netrattler_odds_cache_guard.py"
      - "netrattler_kambi_team_odds.py"
      - "netrattler_aiscore.py"
      - "netrattler_free_odds.py"
      - "netrattler_oddspapi.py"
      - "netrattler_prop_sources.py"
      - "test_netrattler_runtime_patch.py"
      - "test_netrattler_oddspapi_keys.py"
      - "test_netrattler_odds_cache_guard.py"
      - "test_netrattler_kambi_team_odds.py"
      - "test_netrattler_aiscore.py"
      - "netrattler_builder_engine.py"
      - "test_netrattler_builder_delivery.py"
      - "btts_bot.py"
      - "test_netrattler_combo_race_guard.py"
      - "netrattler_hardtest.py"
      - ".github/workflows/netrattler_ci.yml"
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lean test dependencies
        run: python -m pip install --prefer-binary requests beautifulsoup4 cloudscraper pytest pandas
      - name: Compile changed runtime modules
        run: |
          python -m py_compile \
            netrattler_runtime_patch.py \
            netrattler_odds_cache_guard.py \
            netrattler_kambi_team_odds.py \
            netrattler_aiscore.py \
            netrattler_free_odds.py \
            netrattler_oddspapi.py \
            netrattler_prop_sources.py \
            test_netrattler_runtime_patch.py \
            test_netrattler_oddspapi_keys.py \
            test_netrattler_odds_cache_guard.py \
            test_netrattler_kambi_team_odds.py \
            test_netrattler_aiscore.py \
            netrattler_builder_engine.py \
            test_netrattler_builder_delivery.py \
            test_netrattler_combo_race_guard.py \
            btts_bot.py
      - name: OddsPapi secret/config check
        env:
          ODDSPAPI_KEYS: ${{ secrets.ODDSPAPI_KEYS }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          python - <<'PY'
          import netrattler_oddspapi as op
          print(f"ODDSPAPI_CONFIG keys={len(op._keys())}")
          raise SystemExit(0 if op._keys() else 1)
          PY
      - name: OddsPapi multi-key tests
        run: python test_netrattler_oddspapi_keys.py
      - name: Verified builder delivery regression
        run: python -m unittest -v test_netrattler_builder_delivery.py
      - name: Combo dedupe stale-cache regression
        run: python -m unittest -v test_netrattler_combo_race_guard.py
      - name: Runtime fallback and skip tests
        run: python test_netrattler_runtime_patch.py
      - name: Multi-brand Kambi tests
        run: python test_netrattler_kambi_team_odds.py
      - name: Fresh odds cache tests
        run: python test_netrattler_odds_cache_guard.py
      - name: AiScore parser tests
        run: python test_netrattler_aiscore.py
      - name: Player name fuzzy lookup tests
        run: python test_player_name_fuzzy.py
      - name: Empirical probability blend tests
        run: python test_empirical_blend.py
      - name: Table router test
        run: python -m pytest -q test_netrattler_table_router.py
      - name: Kambi strict market classifier test
        run: python -m pytest -q test_kambi_strict_markets.py
      - name: Snapshot BTTS HT isolation test
        run: python -m pytest -q test_free_odds_btts_snapshot.py
      - name: Finishing-radar scorer adjustment test
        run: python -m pytest -q test_netrattler_finishing_adjust.py
      - name: Pinnacle plain BTTS market test
        run: python test_pinnacle_btts_market.py
      - name: Pinnacle 1st-half totals test
        run: python test_pinnacle_ht_totals.py
      - name: 1xBet 1st-half rows test
        run: python test_x1_ht_rows.py
      - name: ESPN player stats scrape test
        run: python test_espn_players_scrape.py
      - name: BTTS+Over2.5 combo rows test
        run: python test_btts_over25_combo_rows.py
      - name: Combo leg text cleaning test
        run: python test_combo_leg_text.py
      - name: Settlement odds guard test
        run: python test_settlement_odds_guard.py
      - name: odds_history special quotes fallback test
        run: python test_oh_special_quotes.py
      - name: Combo prop-leg cap test
        run: python test_combo_prop_cap.py
      - name: ESPN HT backfill test
        run: python test_espn_ht_backfill.py
      - name: Settlement adjacent-day test
        run: python test_settlement_adjacent_day.py
      - name: Pending result backfill test
        run: python test_pending_result_backfill.py
      - name: Stale pending void test
        run: python test_stale_pending_void.py
      - name: ML model quality gate test
        run: python test_model_quality.py
      - name: Kambi criterion player name test
        run: python test_kambi_criterion_player.py
      - name: Gamdom adapter
        run: python -m pytest -q test_gamdom_adapter.py
      - name: CLV test
        run: python -m pytest -q test_clv.py
      - name: Min-prob floors and storage guard tests
        run: python -m pytest -q test_min_prob_floors.py test_storage_guard.py test_builder_dedup_legset.py
      - name: Coverage watchdog test
        run: python -m pytest -q test_coverage_watchdog.py
      - name: Group decode ranking test
        run: python -m pytest -q test_group_decode_rank.py
      - name: 1x group map test
        run: python -m pytest -q test_1x_group_map.py
      - name: Builder disabled styles test
        run: python -m pytest -q test_builder_disabled_styles.py
      - name: footballdata.io adapter
        run: python -m pytest -q test_footballdata_io.py
      - name: API-Football players test
        run: python -m pytest -q test_apifootball_players.py
      - name: Stale void test
        run: python -m pytest -q test_stale_void.py
      - name: API-Football results fallback test
        run: python -m pytest -q test_apifootball_results.py
      - name: RapidAPI results fallback test
        run: python -m pytest -q test_rapid_results.py
      - name: sportapi.ai collector test
        run: python -m pytest -q test_sportapiai.py
      - name: Card signature test
        run: python -m pytest -q test_card_signature.py
      - run: python -m pytest -q test_learned_chat.py
      - run: python -m pytest -q test_builder_legset.py
      - run: python -m pytest -q test_fd_stable_capdate.py
      - run: python -m pytest -q test_card_expected_goals.py
      - run: python -m pytest -q test_apif_player_settlement.py
      - run: python -m pytest -q test_fplci_import.py
      - run: python -m pytest -q test_game_log_sync.py
      - run: python -m pytest -q test_builder_unmodelled_block.py
      - run: python -m pytest -q test_combo_leg_filters.py
      - run: python -m pytest -q test_odds_storage_filter.py
      - run: python -m pytest -q test_void_reconcile.py
      - run: python -m pytest -q test_settle_prefers_observed.py
      - run: python -m pytest -q test_espn_player_import.py
      - run: python -m pytest -q test_odds_band_policy.py
      - run: python -m pytest -q test_key_live.py
      - run: python -m pytest -q test_fuzzy_dup.py
