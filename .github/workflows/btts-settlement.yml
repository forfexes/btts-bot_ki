name: NETRATTLER Main Bot FAST

on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
    - cron: "30 18 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  netrattler-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run NETRATTLER FAST
        env:
          RUN_MODE: "tips"
          RUN_SELF_TEST: "false"
          NETRATTLER_FAST_MODE: "true"
          MAX_LEAGUES_PER_RUN: "8"
          SKIP_LEAGUE_LOOP_AFTER_PINNACLE_TIPS: "5"
          AI_SLEEP_SECONDS: "0.1"
          GROQ_SLEEP_SECONDS: "0.5"

          ENABLE_CORNERS_SCORER: "true"
          ENABLE_CORNERS_BOT: "true"
          ENABLE_SCORER_BOT: "false"
          INCLUDE_CORNERS_IN_MULTI: "true"
          CORNER_COMBO_MIN_PROB: "60"
          MULTI_COMBO_MAX_CORNERS: "2"
          MAX_CORNER_TIPS_SEND: "8"
          SEND_GROUP_AUSWERTUNG_EVERY_RUN: "false"
          SEND_BTTS_STATS_HEADER: "false"
          LOG_DUPLICATE_TIPS: "false"
          LOG_DUPLICATE_CORNERS: "false"
          MAX_TIPS_PER_MARKET_SEND: "8"
          MAX_TOTAL_SINGLE_TIPS_SEND: "35"
          ENABLE_ADVANCED_PROPS: "true"
          ENABLE_AI_ADVANCED_PROPS: "false"
          PROP_WINDOW_HOURS: "12"
          PROP_MAX_RAW_PROPS: "1800"
          PINNACLE_PROPS_CACHE_IN_RUN: "true"
          ENABLE_HEAVY_PROP_DB_BUILDER: "false"
          ENABLE_STATSBOMB_HR: "false"
          ENABLE_PROP_EXTRA_SOURCES: "false"
          PROP_DB_SAVE_LIMIT: "50"
          PROP_BUILDER_MAX_TOTAL: "25"
          PROP_BUILDER_MAX_HIGH_ROLLER: "2"
          ENABLE_PROP_FBREF_CHECK: "false"
          ENABLE_PROP_ODDSPEDIA: "false"
          ENABLE_PROP_FOTMOB: "false"
          MULTI_COMBO_SIZES: "3,4,5,6,7,8,9,10,11"

          APIFOOTBALL_DISABLED: "true"
          API_FOOTBALL_KEY: ""

          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEYS: ${{ secrets.FOOTBALL_DATA_API_KEYS }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_BTTS: ${{ secrets.TELEGRAM_GROUP_BTTS }}
          TELEGRAM_GROUP_OVER25: ${{ secrets.TELEGRAM_GROUP_OVER25 }}
          TELEGRAM_GROUP_COMBO: ${{ secrets.TELEGRAM_GROUP_COMBO }}
          TELEGRAM_GROUP_BTTS_HT: ${{ secrets.TELEGRAM_GROUP_BTTS_HT }}
          TELEGRAM_GROUP_OVER15_HT: ${{ secrets.TELEGRAM_GROUP_OVER15_HT }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          TELEGRAM_GROUP_HZ_LIVE: ${{ secrets.TELEGRAM_GROUP_HZ_LIVE }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          TELEGRAM_GROUP_ADVANCED_PROPS: ${{ secrets.TELEGRAM_GROUP_ADVANCED_PROPS }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "⚡ NETRATTLER FAST Run startet..."
          python btts_bot.py
