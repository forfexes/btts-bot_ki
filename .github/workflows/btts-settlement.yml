name: NETRATTLER Settlement

on:
  schedule:
    # Alle 6 Stunden
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Settlement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          FOOTBALL_DATA_API_KEYS: ${{ secrets.FOOTBALL_DATA_API_KEYS }}
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}

        run: |
          echo "⚽ NETRATTLER Settlement startet..."
          python settlement.py

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-logs
          path: |
            *.log
            *.json
          if-no-files-found: ignore
