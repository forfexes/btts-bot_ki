name: NETRATTLER Goal Hunter Live Backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/netrattler_lmg_backup.yml
  # Also scan when other proven NETRATTLER workflows complete.
  # This bypasses missed Goal Hunter cron slots without requiring new secrets.
  workflow_run:
    workflows:
      - NETRATTLER Post-Run Check
      - NETRATTLER AI Tipp Bot
      - NETRATTLER Odds Harvester V34
      - NETRATTLER API-Football Targeted History
      - NETRATTLER FPLCI Spielerstats Import
      - NETRATTLER Footballdata.io Daily
    types: [completed]
  # Independent trigger for 5-minute scans; SQLite primary key prevents duplicates.
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"

permissions:
  contents: read

concurrency:
  group: netrattler-lmg-free
  cancel-in-progress: false

jobs:
  scan:
    # Post-run checks themselves run after approved upstream tasks; never self-trigger.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.name == 'NETRATTLER Post-Run Check'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      LMG_SQLITE_PATH: ${{ github.workspace }}/.lmg-state/data/goal_hunter.sqlite3
      LMG_STATE_WORKTREE: ${{ github.workspace }}/.lmg-state
      LMG_SQLITE_SYNC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Verify SQLite and original live snapshot safety
        run: |
          python -m py_compile netrattler_lmg_store.py netrattler_lmg_free.py netrattler_lmg_fotmob.py netrattler_lmg_settle.py netrattler_lmg_shadow.py
          python -m unittest -q test_netrattler_lmg_store.py test_netrattler_lmg_shadow.py
      - name: Mount Git-versioned SQLite from repository state branch
        run: |
          git fetch --no-tags origin '+refs/heads/state/goal-hunter:refs/remotes/origin/state/goal-hunter'
          git worktree add --detach .lmg-state refs/remotes/origin/state/goal-hunter
      - name: Initialize and verify SQLite
        run: python netrattler_lmg_store.py init
      - name: Goal Hunter live scan and in-place settlement
        env:
          LMG_SEND: "true"
          LMG_SHADOW_ENABLED: "true"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
        run: |
          python netrattler_lmg_fotmob.py
          python netrattler_lmg_settle.py
          python netrattler_lmg_shadow.py settle
          python netrattler_lmg_store.py status
