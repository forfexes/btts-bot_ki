name: BTTS Settlement ✅
on:
  schedule:
    - cron: '0 15 * * *'    # 15:00 UTC - Nach Asien
    - cron: '45 23 * * *'   # 23:45 UTC - Nach Europa
    - cron: '30 5 * * *'    # 05:30 UTC - Nach Amerika
  workflow_dispatch:
concurrency:
  group: btts-settlement
  cancel-in-progress: false
jobs:
  run-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests python-dotenv
      - name: Run Settlement ✅
        env:
          RUN_MODE: "settlement"
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          ALLSPORTS_API_KEY: ${{ secrets.ALLSPORTS_API_KEY }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python btts_bot.py
      - name: Done
        if: always()
        run: echo "✅ Settlement Complete"
