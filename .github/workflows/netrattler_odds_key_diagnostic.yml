name: NETRATTLER Odds API Key Diagnostic (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check configured keys and free sports catalog without odds calls
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python netrattler_odds_key_diagnostic.py
