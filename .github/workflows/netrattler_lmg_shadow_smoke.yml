name: NETRATTLER Goal Hunter SQLite Shadow Smoke
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/netrattler_lmg_shadow_smoke.yml
permissions:
  contents: read
concurrency:
  group: netrattler-lmg-sqlite-smoke
  cancel-in-progress: false
jobs:
  single-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      LMG_SQLITE_PATH: ${{ github.workspace }}/.lmg-state/data/goal_hunter.sqlite3
      LMG_STATE_WORKTREE: ${{ github.workspace }}/.lmg-state
      LMG_SQLITE_SYNC: 'true'
      LMG_SHADOW_ENABLED: 'true'
      LMG_SEND: 'false'
      LMG_DEEP_POLL_CYCLES: '1'
      LMG_SOURCE_SPORTSCORE_READ_ONLY: 'true'
      LMG_EXTERNAL_SOURCES_SHADOW: 'true'
      TELEGRAM_TOKEN: ''
      TELEGRAM_GROUP_LATE_GOALS: ''
      SUPABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Run real SQLite, parser, team-split and fixture regression tests first
        run: |
          python -m unittest -q test_netrattler_lmg_store.py test_netrattler_lmg_two_stage.py test_netrattler_lmg_sportscore.py
      - name: Check out isolated Git-versioned SQLite branch
        run: |
          git fetch --no-tags origin '+refs/heads/state/goal-hunter:refs/remotes/origin/state/goal-hunter'
          git worktree add --detach .lmg-state refs/remotes/origin/state/goal-hunter
      - name: Migrate SQLite without dropping previous data
        run: python netrattler_lmg_store.py init
      - name: Collect at most one detail snapshot cycle with NO Telegram
        run: python netrattler_lmg_two_stage.py
      - name: Report SQLite counts, no private keys
        run: python netrattler_lmg_store.py status
