name: NETRATTLER Player Stats + Results Scraper V34

on:
  push:
    branches: [main]
    paths:
      - "netrattler_player_history.py"
      - ".github/workflows/scrape_player_stats.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Datum YYYY-MM-DD, leer = gestern"
        required: false
        default: ""
      results_only:
        description: "Nur Ergebnisse"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install all free source dependencies
        run: |
          pip install curl_cffi
          pip install -r requirements.txt || true
          python -m playwright install chromium --with-deps
      - name: Compile
        run: |
          python -m py_compile scrape_player_stats.py netrattler_odds_harvester.py \
            netrattler_fotmob_results.py test_netrattler_fotmob_results.py netrattler_player_history.py
          python test_netrattler_fotmob_results.py
      - name: Run every source with fallback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
          USE_SOFASCORE: "true"
          USE_FOTMOB: "true"
          USE_STATSBOMB: "false"
          USE_FBREF: "false"
          USE_SOCCERDATA: "false"
          ENABLE_SOCCERDATA: "0"
          USE_GITHUB_OPEN_SOURCES: "false"
          USE_ODDSHARVESTER_STYLE: "false"
          ENABLE_ODDSHARVESTER: "false"
          ENABLE_BET365_PUBLIC: "false"
          ENABLE_REEP_IDENTITY: "false"
          SOURCE_MAX_EVENTS: "80"
          SOURCE_SLEEP: "0.08"
          DAILY_RESULTS_PARALLEL_WORKERS: "4"
          DAILY_STATS_PARALLEL_WORKERS: "2"
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; FOTMOB_ARGS="--date ${{ github.event.inputs.date }}"; else ARGS="--yesterday"; FOTMOB_ARGS="--yesterday"; fi
          if [ "${{ github.event.inputs.results_only }}" = "true" ]; then ARGS="$ARGS --results-only"; fi
          python netrattler_fotmob_results.py $FOTMOB_ARGS
          python scrape_player_stats.py $ARGS
      - name: Backfill player history 365d chunk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USE_SOFASCORE: "true"
          USE_FOTMOB: "true"
          USE_ODDSHARVESTER_STYLE: "false"
        run: python netrattler_player_history.py --days 365 --max-dates 365
