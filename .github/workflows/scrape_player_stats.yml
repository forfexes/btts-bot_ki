name: NETRATTLER Player Stats + Results Scraper V34

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Datum YYYY-MM-DD, leer = gestern"
        required: false
        default: ""
      results_only:
        description: "Nur Ergebnisse"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install all free source dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements_all_source.txt
          pip install oddsharvester || pip install git+https://github.com/jordantete/OddsHarvester.git || true
          python -m playwright install chromium --with-deps
      - name: Compile
        run: python -m py_compile scrape_player_stats.py netrattler_odds_harvester.py
      - name: Run every source with fallback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_SESSION_TOKEN: ${{ secrets.BETFAIR_SESSION_TOKEN }}
          USE_SOFASCORE: "true"
          USE_FOTMOB: "true"
          USE_STATSBOMB: "true"
          USE_FBREF: "true"
          USE_SOCCERDATA: "true"
          ENABLE_SOCCERDATA: "1"
          USE_GITHUB_OPEN_SOURCES: "true"
          USE_ODDSHARVESTER_STYLE: "true"
          ENABLE_ODDSHARVESTER: "true"
          ENABLE_BET365_PUBLIC: "true"
          ENABLE_REEP_IDENTITY: "true"
          SOURCE_MAX_EVENTS: "100"
          SOURCE_SLEEP: "0.08"
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; else ARGS="--yesterday"; fi
          if [ "${{ github.event.inputs.results_only }}" = "true" ]; then ARGS="$ARGS --results-only"; fi
          python scrape_player_stats.py $ARGS
