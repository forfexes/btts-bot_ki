name: NETRATTLER Player Stats Scraper V10

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  scrape-player-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Player Stats Scraper V10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          STATSBOMB_MAX_MATCHES: "60"
        run: |
          echo "📊 NETRATTLER Player Stats Scraper V10 startet..."
          python scrape_player_stats.py
