name: NETRATTLER Player Stats + Results Scraper

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Datum (YYYY-MM-DD), leer = gestern"
        required: false
        default: ""
      results_only:
        description: "Nur Ergebnisse scrapen (true/false)"
        required: false
        default: "false"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests cloudscraper supabase python-dotenv
          pip install -r requirements_all_source.txt
          python -m playwright install chromium --with-deps

      - name: Compile Scraper
        run: python -m py_compile scrape_player_stats.py

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}

          # Source-Schalter:
          # SofaScore/FBref sind bei dir aktuell 403, deshalb default AUS.
          USE_SOFASCORE: "false"
          USE_FOTMOB: "true"
          USE_STATSBOMB: "true"
          USE_FBREF: "false"
          USE_SOCCERDATA: "true"
          ENABLE_SOCCERDATA: "1"
          SOURCE_MAX_EVENTS: "60"
          SOURCE_SLEEP: "0.10"
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          else
            ARGS="--yesterday"
          fi
          if [ "${{ github.event.inputs.results_only }}" = "true" ]; then
            ARGS="$ARGS --results-only"
          fi
          python scrape_player_stats.py $ARGS
