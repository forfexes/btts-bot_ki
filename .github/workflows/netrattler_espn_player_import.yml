name: NETRATTLER ESPN Spielerstats Import
on:
  workflow_dispatch:
    inputs:
      days:
        description: Anzahl Tage
        default: "3"
      offset:
        description: Start in Tagen vor heute
        default: "0"
  schedule:
    - cron: "40 3,9,15,21 * * *"
permissions:
  contents: read
concurrency:
  group: netrattler-espn-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_DAYS: ${{ github.event.inputs.days || '3' }}
          ESPN_START_OFFSET: ${{ github.event.inputs.offset || '0' }}
        run: python netrattler_espn_player_import.py
      - if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_game_log_sync.py
