# Schedule removed 2026-10-17: BetClone investigation finished (see BETCLONE_STATUS.md); saves Actions minutes. Run by hand via workflow_dispatch.
name: NETRATTLER BetClone Playwright Audit

on:
  push:
    branches: [main]
    paths:
      - 'netrattler_betclone_browser_probe.py'
      - 'netrattler_betclone_hardprobe.py'
      - 'test_netrattler_betclone_hardprobe.py'
      - 'test_netrattler_betclone_browser_probe.py'
      - '.github/workflows/netrattler_betclone_browser_probe.yml'
  workflow_dispatch:

jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded public-browser dependencies
        run: |
          python -m pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps --only-shell chromium
      - name: Validate fail-closed public-site probing
        run: |
          python -m py_compile netrattler_betclone_browser_probe.py test_netrattler_betclone_browser_probe.py
          python -m unittest -v test_netrattler_betclone_browser_probe.py test_netrattler_betclone_hardprobe.py
      - name: Probe sixteen curated public rendered operator pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python netrattler_betclone_browser_probe.py --limit 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-betclone-public-browser-audit
          path: netrattler_betclone_browser_probe.json
          retention-days: 7

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats,netrattler_match_history
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
