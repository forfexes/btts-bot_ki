name: NETRATTLER Fouls Builder Premium Hardtest
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "netrattler_foul_props.py"
      - "netrattler_fouls_builder_premium.py"
      - "test_foul_props.py"
      - "test_netrattler_fouls_builder_premium.py"
      - "test_netrattler_fouls_legacy_send_gate.py"
      - "netrattler_model_builders.py"
      - "netrattler_lineup_builders.py"
      - "test_netrattler_lineup_foul_scout.py"
      - "test_model_builders.py"
      - "netrattler_builder_cards.py"
      - ".github/workflows/netrattler_fouls_builder_qa.yml"

permissions:
  contents: read

jobs:
  foul-ticket-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      NETRATTLER_FOULS_BUILDER_SEND: "false"
      NETRATTLER_MODEL_BUILDER_OFFLINE_QA: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated testing requirements
        run: python -m pip install --quiet requests Pillow pytest
      - name: Syntax gate
        run: python -m py_compile netrattler_foul_props.py netrattler_fouls_builder_premium.py test_netrattler_fouls_builder_premium.py test_foul_props.py test_model_builders.py test_netrattler_fouls_legacy_send_gate.py
      - name: Untrusted screenshot and same-match Fouls QA
        run: python -m unittest -v test_netrattler_fouls_builder_premium
      - name: Existing player-stat and quota regressions
        run: python -m pytest -q test_foul_props.py
      - name: Prevent all unquoted model builders from reaching database or Telegram
        run: |
          python -m pytest -q test_netrattler_fouls_legacy_send_gate.py
          python -m pytest -q test_model_builders.py
      - name: Exact provider start XI to safe scouting integration
        run: python -m pytest -q test_netrattler_lineup_foul_scout.py test_lineup_builders.py
