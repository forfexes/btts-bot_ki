name: GOAL HUNTER Remove Existing Photo Undertext

# The existing photo caption was removed successfully; run only on explicit dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q requests
      - name: Remove caption from existing BK Haecken vs Manchester City photo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          base=(os.getenv("SUPABASE_URL") or "").rstrip("/")
          key=os.getenv("SUPABASE_SERVICE_ROLE_KEY") or os.getenv("SUPABASE_KEY")
          token=os.getenv("TELEGRAM_TOKEN")
          chat=os.getenv("TELEGRAM_GROUP_LATE_GOALS")
          if not (base and key and token and chat):
              raise RuntimeError("Missing required service secrets")
          response=requests.get(
              base+"/rest/v1/netrattler_lmg_alerts",
              headers={"apikey":key,"Authorization":"Bearer "+key},
              params={"select":"alert_key,fixture_id,home,away,message_kind,telegram_message_id",
                      "alert_key":"eq.6148609","limit":"1"},timeout=15)
          response.raise_for_status()
          rows=response.json()
          if len(rows)!=1:
              raise RuntimeError("Expected precisely one existing alert")
          row=rows[0]
          if not (str(row.get("alert_key"))=="6148609"
                  and row.get("fixture_id")==6148609
                  and row.get("home")=="BK Häcken (W)"
                  and row.get("away")=="Manchester City (W)"
                  and row.get("message_kind")=="photo"
                  and row.get("telegram_message_id")==973):
              raise RuntimeError("Telegram message identity verification failed")
          result=requests.post(
              "https://api.telegram.org/bot"+token+"/editMessageCaption",
              json={"chat_id":chat,"message_id":973,"caption":""},timeout=20)
          data=result.json()
          if data.get("ok"):
              print("LMG_EXISTING_PHOTO_CAPTION_REMOVED fixture=6148609 msg=973")
          elif "message is not modified" in str(data.get("description","")).casefold():
              print("LMG_EXISTING_PHOTO_CAPTION_ALREADY_EMPTY fixture=6148609 msg=973")
          else:
              raise RuntimeError("Telegram caption cleanup failed: "+str(data.get("description",""))[:140])
          PY
