name: NETRATTLER AiScore Public Collector

# Scheduled runs disabled 2026-10-16: source_health shows EVERY run since at
# least 2026-10-03 (two weeks straight, both weekday and weekend slots) hit
# http=403 on all 120/120 pages, 0 odds, 0 h2h - a complete, persistent block,
# not a transient blip. Each run was still reported "success" by GitHub
# Actions (the script degrades gracefully on zero data), which is exactly the
# "green run is not proof of a working source" trap - confirmed here via
# source_health, not assumed from the green checkmark. No bypass/stealth
# technique was attempted or will be; this collector already used a single
# honest User-Agent. workflow_dispatch is kept so this can be re-checked by
# hand later without burning ~6 CI minutes/day on a confirmed-dead source.
on:
  push:
    branches: [main]
    paths:
      - "netrattler_aiscore.py"
      - "test_netrattler_aiscore.py"
      - ".github/workflows/netrattler_aiscore.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum AiScore matches"
        required: false
        default: "40"

jobs:
  aiscore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install keyless browser collector
        run: |
          python -m pip install --prefer-binary requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Compile + parser tests
        run: |
          python -m py_compile netrattler_aiscore.py test_netrattler_aiscore.py
          python test_netrattler_aiscore.py

      - name: Collect public AiScore H2H / lineups / explicit observed odds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NETRATTLER_AISCORE_MAX_MATCHES: ${{ github.event.inputs.limit || '40' }}
          NETRATTLER_AISCORE_TIMEOUT: "12"
          NETRATTLER_AISCORE_BROWSER_WAIT_MS: "1800"
          NETRATTLER_AISCORE_MATCH_SLEEP: "0.25"
        run: python netrattler_aiscore.py --limit "${{ github.event.inputs.limit || '40' }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-aiscore-snapshot
          path: netrattler_aiscore_snapshot.json
          if-no-files-found: ignore

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
