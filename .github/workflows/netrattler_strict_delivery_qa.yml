name: NETRATTLER Strict Card Delivery QA
"on":
  push:
    paths:
      - btts_bot.py
      - netrattler_strict_delivery.py
      - test_netrattler_strict_delivery.py
      - .github/workflows/netrattler_strict_delivery_qa.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      NETRATTLER_SCORER_MIN_PROB: '0.26'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow pytest requests cairosvg
      - run: python -m py_compile btts_bot.py netrattler_strict_delivery.py
      - run: python -m pytest -q test_netrattler_strict_delivery.py test_netrattler_stadium_portrait.py test_netrattler_scorer_qualification.py
