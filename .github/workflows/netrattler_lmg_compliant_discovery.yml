name: NETRATTLER Goal Hunter Open API Discovery (SQLite)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/netrattler_lmg_compliant_discovery.yml
      - netrattler_lmg_sportscore_shadow.py
      - test_netrattler_lmg_sportscore_shadow.py
  schedule:
    # 10-minute source-health checks. GitHub schedule is best-effort.
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: read
# Share the SQLite state lock with the legacy Goal Hunter workflow.
concurrency:
  group: netrattler-lmg-free
  cancel-in-progress: false
jobs:
  licensed-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      LMG_SQLITE_PATH: ${{ github.workspace }}/.lmg-state/data/goal_hunter.sqlite3
      LMG_STATE_WORKTREE: ${{ github.workspace }}/.lmg-state
      LMG_SQLITE_SYNC: 'true'
      LMG_SPORTSCORE_SHADOW: 'true'
      LMG_SEND: 'false'
      TELEGRAM_TOKEN: ''
      TELEGRAM_GROUP_LATE_GOALS: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      # We only use the published API and retain attribution.
      SPORTSOURCE_CREDIT: 'Powered by SportScore — https://sportscore.com/'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Offline SportScore source and SQLite safety checks
        run: |
          python -m py_compile netrattler_lmg_sportscore_shadow.py test_netrattler_lmg_sportscore_shadow.py
          python -m unittest -q test_netrattler_lmg_sportscore_shadow.py test_netrattler_lmg_sportscore.py
      - name: Check out Git versioned SQLite state
        run: |
          git fetch --no-tags origin '+refs/heads/state/goal-hunter:refs/remotes/origin/state/goal-hunter'
          git worktree add --detach .lmg-state refs/remotes/origin/state/goal-hunter
      - name: Official SportScore football discovery, SQLite only
        run: python netrattler_lmg_sportscore_shadow.py
      - name: Verify saved state without Telegram
        run: python netrattler_lmg_store.py status
