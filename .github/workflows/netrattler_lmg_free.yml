name: NETRATTLER Last Minute Goal FREE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - netrattler_lmg_free.py
      - netrattler_lmg_fotmob.py
      - netrattler_lmg_card.py
      - netrattler_lmg_settle.py
      - test_netrattler_lmg_card.py
      - test_netrattler_lmg_fotmob.py
      - netrattler_lmg_probe.py
      - netrattler_last_minute_goal.py
      - test_netrattler_lmg_free.py
      - .github/workflows/netrattler_lmg_free.yml
  # 24h public-data scanning every 5m; non-hour-boundary minutes reduce cron congestion.
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"

permissions:
  contents: read

concurrency:
  group: netrattler-lmg-free
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --prefer-binary requests Pillow
      - name: Syntax and offline regression tests
        run: |
          python -m py_compile netrattler_last_minute_goal.py netrattler_lmg_free.py netrattler_lmg_fotmob.py netrattler_lmg_card.py netrattler_lmg_settle.py test_netrattler_lmg_free.py test_netrattler_lmg_fotmob.py test_netrattler_lmg_card.py
          python -m unittest -v test_netrattler_lmg_free.py test_netrattler_lmg_fotmob.py test_netrattler_lmg_card.py

  visual-preview:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Render example cards without live data or Telegram posting
        run: |
          mkdir -p visual-preview
          python - <<'PY'
          import os
          from unittest.mock import patch
          from netrattler_lmg_card import make_card
          fixture={"home":"Tampines Rovers FC","away":"Ratchaburi FC",
                   "hg":1,"ag":2,"minute":68,"league":"ASEAN Club Championship",
                   "home_logo_id":None,"away_logo_id":None}
          metrics={"tier":"STANDARD","teams":{"home":{"shots":10,"sot":4,"corners":3,"xg":1.62},
                                                   "away":{"shots":5,"sot":2,"corners":2,"xg":0.87}}}
          with patch("netrattler_lmg_card.crest",return_value=None):
              for name,opts in (("open",{"metrics":metrics}),
                                ("won",{"final_score":"3:2","won":True}),
                                ("lost",{"final_score":"1:2","won":False})):
                  data=make_card(fixture,**opts)
                  with open(f"visual-preview/{name}.jpg","wb") as out:
                      out.write(data)
                  print("LMG_VISUAL_PREVIEW",name,len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: goal-hunter-visual-preview
          path: visual-preview/*.jpg
          retention-days: 3

  smoke:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: FotMob/ESPN public live smoke test - read only, no bookmaker key
        env:
          LMG_SEND: "false"
        run: |
          python netrattler_lmg_probe.py
          python netrattler_lmg_fotmob.py

  scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Late-goal scanner - one more goal from minute 65, no odds
        env:
          LMG_SEND: "true"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python netrattler_lmg_fotmob.py
          python netrattler_lmg_settle.py
