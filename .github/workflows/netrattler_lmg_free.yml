name: NETRATTLER Last Minute Goal FREE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - netrattler_lmg_free.py
      - netrattler_lmg_fotmob.py
      - netrattler_lmg_shadow.py
      - netrattler_lmg_store.py
      - netrattler_lmg_api_fallback.py
      - test_netrattler_lmg_api_fallback.py
      - test_netrattler_lmg_store.py
      - test_netrattler_lmg_shadow.py
      - netrattler_lmg_card.py
      - netrattler_lmg_next_goal.py
      - test_netrattler_lmg_next_goal.py
      - assets/goal_hunter_original_header.webp
      - assets/goal_hunter_neon_frame.webp
      - netrattler_lmg_settle.py
      - test_netrattler_lmg_card.py
      - test_netrattler_lmg_fotmob.py
      - netrattler_lmg_probe.py
      - netrattler_lmg_source_compare.py
      - test_netrattler_lmg_source_compare.py
      - netrattler_last_minute_goal.py
      - test_netrattler_lmg_free.py
      - .github/workflows/netrattler_lmg_free.yml
  # 24h public-data scanning every 5m; shifted cron re-registers the schedule on default branch.
  # GitHub schedule is best-effort; manual workflow_dispatch remains available.
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: read

concurrency:
  group: netrattler-lmg-free
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Scheduled scans must fit the live minute window: don't install
      # test dependencies or run the entire suite on every five-minute tick.
      # The full suite still gates push and manual executions.
      - name: Fast syntax check for scheduled live scans
        if: github.event_name == 'schedule'
        run: |
          python -m py_compile netrattler_last_minute_goal.py netrattler_lmg_free.py netrattler_lmg_fotmob.py netrattler_lmg_card.py netrattler_lmg_settle.py netrattler_lmg_next_goal.py netrattler_lmg_shadow.py netrattler_lmg_store.py netrattler_lmg_api_fallback.py netrattler_lmg_source_compare.py
      - name: Install dependencies for full regression suite
        if: github.event_name != 'schedule'
        run: python -m pip install --prefer-binary requests Pillow
      - name: Full syntax and offline regression tests
        if: github.event_name != 'schedule'
        run: |
          python -m py_compile netrattler_last_minute_goal.py netrattler_lmg_free.py netrattler_lmg_fotmob.py netrattler_lmg_card.py netrattler_lmg_settle.py netrattler_lmg_next_goal.py netrattler_lmg_shadow.py netrattler_lmg_store.py netrattler_lmg_api_fallback.py test_netrattler_lmg_api_fallback.py test_netrattler_lmg_store.py test_netrattler_lmg_free.py test_netrattler_lmg_fotmob.py test_netrattler_lmg_card.py test_netrattler_lmg_next_goal.py test_netrattler_lmg_shadow.py netrattler_lmg_source_compare.py test_netrattler_lmg_source_compare.py
          python -m unittest -v test_netrattler_lmg_free.py test_netrattler_lmg_fotmob.py test_netrattler_lmg_card.py test_netrattler_lmg_next_goal.py test_netrattler_lmg_shadow.py test_netrattler_lmg_store.py test_netrattler_lmg_api_fallback.py test_netrattler_lmg_source_compare.py

  visual-preview:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Render example cards without live data or Telegram posting
        run: |
          mkdir -p visual-preview
          python - <<'PY'
          from netrattler_lmg_card import make_card
          fixture={"home":"Tampines Rovers FC","away":"Ratchaburi FC",
                   "hg":1,"ag":2,"minute":68,"league":"ASEAN Club Championship",
                   "home_logo_id":67386,"away_logo_id":421346}
          from netrattler_lmg_next_goal import select_next_goal
          metrics={"tier":"STANDARD","teams":{"home":{"shots":17,"sot":8,"corners":5,"xg":1.75},
                                                   "away":{"shots":9,"sot":3,"corners":3,"xg":0.60}}}
          metrics["next_goal_side"]=select_next_goal(metrics)
          assert metrics["next_goal_side"]=="home", "Demo team side must pass production rules"
          for name,opts in (("open",{"metrics":metrics}),
                            ("won",{"final_score":"3:2","won":True,"next_goal_side":"home","next_goal_result":"won"}),
                            ("lost",{"final_score":"1:2","won":False,"next_goal_side":"home","next_goal_result":"void"})):
              data=make_card(fixture,**opts)
              with open(f"visual-preview/{name}.jpg","wb") as out:
                  out.write(data)
              print("LMG_VISUAL_PREVIEW",name,len(data))
          print("LMG_VISUAL_NOTE demo statistics only; real matching club IDs used for crest loading")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: goal-hunter-visual-preview
          path: visual-preview/*.jpg
          retention-days: 3

  smoke:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: FotMob/ESPN public live smoke test - read only, no bookmaker key
        env:
          LMG_SEND: "false"
        run: |
          python netrattler_lmg_probe.py
          python netrattler_lmg_source_compare.py
          python netrattler_lmg_fotmob.py

  scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # ONLY scan writes the dedicated SQLite state branch
    env:
      LMG_SQLITE_PATH: ${{ github.workspace }}/.lmg-state/data/goal_hunter.sqlite3
      LMG_STATE_WORKTREE: ${{ github.workspace }}/.lmg-state
      LMG_SQLITE_SYNC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Mount persistent SQLite branch in a separate worktree
        run: |
          git fetch --no-tags origin '+refs/heads/state/goal-hunter:refs/remotes/origin/state/goal-hunter'
          git worktree add --detach .lmg-state refs/remotes/origin/state/goal-hunter
      - name: Initialize and verify SQLite before any Telegram message
        run: python netrattler_lmg_store.py init
      - name: Goal Hunter live scan and original-card settlement
        env:
          LMG_SEND: "true"
          LMG_SHADOW_ENABLED: "true"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python netrattler_lmg_fotmob.py
          python netrattler_lmg_settle.py
          python netrattler_lmg_shadow.py settle
          python netrattler_lmg_store.py status
