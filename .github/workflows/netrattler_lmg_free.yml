name: NETRATTLER Last Minute Goal FREE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - netrattler_lmg_free.py
      - netrattler_lmg_fotmob.py
      - netrattler_lmg_two_stage.py
      - test_netrattler_lmg_two_stage.py
      - netrattler_lmg_external_sources.py
      - netrattler_lmg_sportscore_probe.py
      - test_netrattler_lmg_sportscore.py
      - netrattler_lmg_shadow.py
      - netrattler_lmg_store.py
      - netrattler_lmg_api_fallback.py
      - test_netrattler_lmg_api_fallback.py
      - test_netrattler_lmg_store.py
      - test_netrattler_lmg_shadow.py
      - netrattler_lmg_card.py
      - netrattler_lmg_next_goal.py
      - test_netrattler_lmg_next_goal.py
      - assets/goal_hunter_original_header.webp
      - assets/goal_hunter_neon_frame.webp
      - netrattler_lmg_settle.py
      - test_netrattler_lmg_card.py
      - test_netrattler_lmg_fotmob.py
      - netrattler_lmg_probe.py
      - netrattler_lmg_source_compare.py
      - test_netrattler_lmg_source_compare.py netrattler_lmg_two_stage.py test_netrattler_lmg_two_stage.py
      - netrattler_last_minute_goal.py
      - test_netrattler_lmg_free.py
      - .github/workflows/netrattler_lmg_free.yml
  # Schedule paused pending approved premium card templates.

permissions:
  contents: read

concurrency:
  group: netrattler-lmg-free
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Scheduled scans must fit the live minute window: don't install
      # test dependencies or run the entire suite on every five-minute tick.
      # The full suite still gates push and manual executions.
      - name: Fast syntax check for scheduled live scans
        if: github.event_name == 'schedule'
        run: |
          python -m py_compile netrattler_last_minute_goal.py netrattler_lmg_free.py netrattler_lmg_fotmob.py netrattler_lmg_card.py netrattler_lmg_settle.py netrattler_lmg_next_goal.py netrattler_lmg_shadow.py netrattler_lmg_store.py netrattler_lmg_api_fallback.py netrattler_lmg_two_stage.py netrattler_lmg_source_compare.py
      - name: Install dependencies for full regression suite
        if: github.event_name != 'schedule'
        run: python -m pip install --prefer-binary requests Pillow
      - name: Full syntax and offline regression tests
        if: github.event_name != 'schedule'
        run: |
          python -m py_compile netrattler_last_minute_goal.py netrattler_lmg_free.py netrattler_lmg_fotmob.py netrattler_lmg_card.py netrattler_lmg_settle.py netrattler_lmg_next_goal.py netrattler_lmg_shadow.py netrattler_lmg_store.py netrattler_lmg_api_fallback.py test_netrattler_lmg_api_fallback.py test_netrattler_lmg_store.py test_netrattler_lmg_free.py test_netrattler_lmg_fotmob.py test_netrattler_lmg_card.py test_netrattler_lmg_next_goal.py test_netrattler_lmg_shadow.py netrattler_lmg_source_compare.py test_netrattler_lmg_source_compare.py test_netrattler_lmg_two_stage.py
          python -m unittest -v test_netrattler_lmg_sportscore.py test_netrattler_lmg_free.py test_netrattler_lmg_fotmob.py test_netrattler_lmg_card.py test_netrattler_lmg_next_goal.py test_netrattler_lmg_shadow.py test_netrattler_lmg_store.py test_netrattler_lmg_api_fallback.py test_netrattler_lmg_source_compare.py test_netrattler_lmg_two_stage.py

  visual-preview:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Render source-derived owner PNG previews, never legacy JPEGs
        run: |
          mkdir -p visual-preview
          python - <<'PY'
          from io import BytesIO
          from PIL import Image, ImageDraw
          from last_minute_owner_20261122.live_data_bridge import make_live, make_settled

          fixture={"home":"TEST HEIM","away":"TEST GAST","hg":1,"ag":1,
                   "minute":75,"league":"SANDBOX TESTLIGA",
                   "home_logo_id":1,"away_logo_id":2}
          def qa_crest(team_id):
              assert team_id in (1,2)
              im=Image.new("RGBA",(110,110),(0,0,0,0))
              d=ImageDraw.Draw(im)
              d.ellipse((6,6,104,104),fill=(25,91,158) if team_id==1 else (151,84,31),
                        outline=(246,201,51),width=5)
              b=BytesIO()
              im.save(b,"PNG")
              return b.getvalue()
          metrics={"teams":{"home":{"shots":15,"sot":7,"corners":4,"xg":1.40},
                            "away":{"shots":8,"sot":2,"corners":3,"xg":0.63}},
                   "next_goal_side":"home","next_goal_verified":True}
          cards={
              "open":make_live(fixture,metrics,crest_provider=qa_crest,preview_only=True),
              "won":make_settled(fixture,final_score="2:1",won=True,
                                 next_goal_side="home",next_goal_result="won",
                                 crest_provider=qa_crest,preview_only=True),
              "lost":make_settled(fixture,final_score="1:1",won=False,
                                  next_goal_side="home",next_goal_result="unverified",
                                  crest_provider=qa_crest,preview_only=True),
          }
          for name,png in cards.items():
              with Image.open(BytesIO(png)) as im:
                  assert im.format=="PNG" and im.size==(1024,1078)
                  im.verify()
              with open(f"visual-preview/{name}.png","wb") as out:
                  out.write(png)
              print("OWNER_ORIGINAL_SANDBOX_PREVIEW",name,len(png))
          print("NO LIVE ODDS / NO TELEGRAM / NO LEGACY JPEG / QA-ONLY CRESTS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: goal-hunter-owner-original-visual-preview
          path: visual-preview/*.png
          retention-days: 7

  smoke:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: FotMob/ESPN public live smoke test - read only, no bookmaker key
        env:
          LMG_SEND: "false"
        run: |
          python netrattler_lmg_probe.py
          python netrattler_lmg_source_compare.py
          python netrattler_lmg_fotmob.py

  shadow-deep-poll:
    # Collect verified Goal Hunter details without changing the disabled
    # production Telegram scan. Only scheduled runs write Git SQLite state.
    needs: verify
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      LMG_SQLITE_PATH: ${{ github.workspace }}/.lmg-state/data/goal_hunter.sqlite3
      LMG_STATE_WORKTREE: ${{ github.workspace }}/.lmg-state
      LMG_SQLITE_SYNC: "true"
      LMG_SEND: "false"
      LMG_SHADOW_ENABLED: "true"
      LMG_DEEP_POLL_CYCLES: "3"
      # Official public SportScore API: independent read-only coverage audit.
      # The complete live-tips job remains disabled until original-card QA.
      LMG_SOURCE_SPORTSCORE_READ_ONLY: "true"
      LMG_EXTERNAL_SOURCES_SHADOW: "true"
      TELEGRAM_TOKEN: ""
      TELEGRAM_GROUP_LATE_GOALS: ""
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Mount Git-versioned Goal Hunter SQLite
        run: |
          git fetch --no-tags origin '+refs/heads/state/goal-hunter:refs/remotes/origin/state/goal-hunter'
          git worktree add --detach .lmg-state refs/remotes/origin/state/goal-hunter
      - name: Validate SQLite integrity and initialise deep-stat schema
        run: python netrattler_lmg_store.py init
      - name: Discover once and poll verified filtered fixture IDs each 75 seconds
        run: python netrattler_lmg_two_stage.py
      - name: Verify SQLite state after polling
        if: success()
        run: python netrattler_lmg_store.py status

  scan:
    needs: verify
    # TEMPORARILY DISABLED: no live Telegram scans until original cards pass visual acceptance.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write # ONLY scan writes the dedicated SQLite state branch
    env:
      LMG_SQLITE_PATH: ${{ github.workspace }}/.lmg-state/data/goal_hunter.sqlite3
      LMG_STATE_WORKTREE: ${{ github.workspace }}/.lmg-state
      LMG_SQLITE_SYNC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests Pillow
      - name: Mount persistent SQLite branch in a separate worktree
        run: |
          git fetch --no-tags origin '+refs/heads/state/goal-hunter:refs/remotes/origin/state/goal-hunter'
          git worktree add --detach .lmg-state refs/remotes/origin/state/goal-hunter
      - name: Initialize and verify SQLite before any Telegram message
        run: python netrattler_lmg_store.py init
      - name: Goal Hunter live scan and original-card settlement
        env:
          LMG_SEND: "true"
          LMG_SHADOW_ENABLED: "true"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_GROUP_LATE_GOALS: ${{ secrets.TELEGRAM_GROUP_LATE_GOALS }}
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python netrattler_lmg_fotmob.py
          # Shadow-only 75-second polling: persist source-verified observations
          # to Git-versioned SQLite; NEVER post a second Telegram tip.
          LMG_SEND=false LMG_SHADOW_ENABLED=true LMG_DEEP_POLL_CYCLES=3 python netrattler_lmg_two_stage.py
          python netrattler_lmg_settle.py
          python netrattler_lmg_shadow.py settle
          python netrattler_lmg_store.py status
