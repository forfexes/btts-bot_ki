name: NETRATTLER Offline Sandbox Hardtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'netrattler_hardtest.py'
      - 'test_netrattler_keyless_odds.py'
      - 'test_netrattler_open_source_registry.py'
      - 'netrattler_source_hub.py'
      - 'netrattler_identity_hub.py'
      - 'test_netrattler_odds_cache_guard.py'
      - 'test_netrattler_scorer_history_fallback.py'
      - 'test_netrattler_thesportsdb_guard.py'
      - 'test_netrattler_playwright_runtime.py'
      - 'test_netrattler_kambi_scorer_market.py'
      - 'netrattler_open_h2h.py'
      - 'test_netrattler_open_h2h.py'
      - 'netrattler_health_check.py'
      - 'test_netrattler_health_check.py'
      - 'netrattler_odds_harvester.py'
      - 'netrattler_html_odds_scraper.py'
      - 'test_netrattler_html_odds_scraper.py'
      - 'test_netrattler_new_odds_sources.py'
      - 'netrattler_keyless_odds.py'
      - 'netrattler_odds_cache_guard.py'
      - 'netrattler_scorer.py'
      - 'netrattler_builder_engine.py'
      - 'netrattler_builder_guard.py'
      - 'netrattler_builder_styles.py'
      - 'netrattler_builder_concepts_v2.py'
      - 'netrattler_prop_sources.py'
      - 'netrattler_settlement_runner.py'
      - 'test_netrattler_builder_delivery.py'
      - 'netrattler_settlement_v16_final.py'
      - 'test_netrattler_settlement_v21.py'
      - 'netrattler_stats_match_cards.py'
      - 'test_netrattler_goalhunter_photos.py'
      - '.github/workflows/netrattler_sandbox_hardtest.yml'

permissions:
  contents: read

concurrency:
  group: netrattler-sandbox-hardtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-hardtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NETRATTLER_PLAYWRIGHT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check requests python-dotenv pillow beautifulsoup4 lxml numpy scipy scikit-learn pytest
      - name: Run offline consolidated hardtest
        shell: bash
        run: |
          set -o pipefail
          python netrattler_hardtest.py 2>&1 | tee netrattler-hardtest.log
      - name: Run odds, source and player regression suites
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra test_netrattler_keyless_odds.py test_netrattler_odds_cache_guard.py test_netrattler_scorer_history_fallback.py test_netrattler_thesportsdb_guard.py test_netrattler_playwright_runtime.py test_netrattler_kambi_scorer_market.py test_netrattler_goalhunter_photos.py test_netrattler_open_source_registry.py test_netrattler_html_odds_scraper.py test_netrattler_new_odds_sources.py 2>&1 | tee netrattler-source-tests.log
      - name: Upload diagnostics even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-sandbox-hardtest
          path: |
            netrattler-hardtest.log
            netrattler-source-tests.log
          if-no-files-found: warn
          retention-days: 7

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_game_log,player_match_stats
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
