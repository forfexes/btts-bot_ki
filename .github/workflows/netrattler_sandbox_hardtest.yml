name: NETRATTLER Offline Sandbox Hardtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'netrattler_hardtest.py'
      - 'test_netrattler_keyless_odds.py'
      - 'test_netrattler_open_source_registry.py'
      - 'netrattler_source_hub.py'
      - 'netrattler_identity_hub.py'
      - 'test_netrattler_odds_cache_guard.py'
      - 'test_netrattler_scorer_history_fallback.py'
      - 'netrattler_scorer_identity.py'
      - 'test_netrattler_scorer_identity.py'
      - 'test_netrattler_thesportsdb_guard.py'
      - 'test_netrattler_playwright_runtime.py'
      - 'test_netrattler_kambi_scorer_market.py'
      - 'netrattler_open_h2h.py'
      - 'test_netrattler_open_h2h.py'
      - 'netrattler_health_check.py'
      - 'test_netrattler_health_check.py'
      - 'netrattler_odds_harvester.py'
      - 'netrattler_html_odds_scraper.py'
      - 'netrattler_open_matchday.py'
      - 'test_netrattler_open_matchday.py'
      - 'netrattler_odds_key_diagnostic.py'
      - 'test_netrattler_odds_key_diagnostic.py'
      - 'test_netrattler_html_odds_scraper.py'
      - 'test_netrattler_new_odds_sources.py'
      - 'netrattler_keyless_odds.py'
      - 'netrattler_odds_cache_guard.py'
      - 'netrattler_scorer.py'
      - 'netrattler_model_builders.py'
      - 'test_model_builders.py'
      - 'netrattler_builder_engine.py'
      - 'netrattler_builder_guard.py'
      - 'netrattler_builder_styles.py'
      - 'netrattler_builder_concepts_v2.py'
      - 'netrattler_prop_sources.py'
      - 'netrattler_settlement_runner.py'
      - 'test_netrattler_builder_delivery.py'
      - 'netrattler_settlement_v16_final.py'
      - 'test_netrattler_settlement_v21.py'
      - 'test_netrattler_settlement_stats_schema.py'
      - 'netrattler_1x_group_decode.py'
      - 'test_netrattler_1x_group_decode.py'
      - 'netrattler_stats_match_cards.py'
      - 'netrattler_lmg_two_stage.py'
      - 'test_netrattler_lmg_two_stage.py'
      - 'netrattler_lmg_store.py'
      - 'netrattler_premium_verified_cards.py'
      - 'netrattler_premium_compact.py'
      - 'test_netrattler_premium_verified_cards.py'
      - 'test_netrattler_premium_dispatch_gate.py'
      - 'netrattler_premium_telegram_adapter.py'
      - 'netrattler_premium_sandbox_preview.py'
      - 'netrattler_telegram_sandbox_hardtest.py'
      - 'netrattler_card_visual_preview.py'
      - 'assets/premium_*_blank.svg'
      - 'test_netrattler_goalhunter_photos.py'
      - '.github/workflows/netrattler_sandbox_hardtest.yml'

permissions:
  contents: read

concurrency:
  group: netrattler-sandbox-hardtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-hardtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SUPABASE_URL: ''
      SUPABASE_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      NETRATTLER_PLAYWRIGHT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check requests python-dotenv pillow cairosvg beautifulsoup4 lxml numpy scipy scikit-learn pytest
      - name: Run offline consolidated hardtest
        shell: bash
        run: |
          set -o pipefail
          python netrattler_hardtest.py 2>&1 | tee netrattler-hardtest.log
      - name: Run odds, source and player regression suites
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -ra test_netrattler_keyless_odds.py test_netrattler_odds_cache_guard.py test_netrattler_scorer_history_fallback.py test_netrattler_scorer_identity.py test_netrattler_thesportsdb_guard.py test_netrattler_playwright_runtime.py test_netrattler_kambi_scorer_market.py test_netrattler_goalhunter_photos.py test_netrattler_open_source_registry.py test_netrattler_html_odds_scraper.py test_netrattler_new_odds_sources.py test_netrattler_open_matchday.py test_netrattler_odds_key_diagnostic.py test_netrattler_settlement_stats_schema.py test_netrattler_1x_group_decode.py test_model_builders.py 2>&1 | tee netrattler-source-tests.log
      - name: Mandatory offline premium card visual and routing Hardtest
        if: success() || failure()
        shell: bash
        env:
          TELEGRAM_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          TELEGRAM_GROUP_MATCH_CARDS: ''
          SUPABASE_URL: ''
          # Offline-only fixture authorization: NEVER a production release.
          NETRATTLER_BLOCK_OVERPAINTED_MASTERS: '0'
        run: |
          set -o pipefail
          python -m pytest -q -ra test_netrattler_premium_verified_cards.py test_netrattler_premium_dispatch_gate.py test_netrattler_ai_match_card_design.py 2>&1 | tee netrattler-premium-card-hardtest.log
      - name: Render synthetic premium PNG previews for visual inspection
        if: success()
        env:
          # TEST ONLY; no production credentials or Telegram publishing.
          NETRATTLER_BLOCK_OVERPAINTED_MASTERS: '0'
          TELEGRAM_TOKEN: ''
          SUPABASE_URL: ''
        run: |
          python netrattler_premium_sandbox_preview.py
      - name: Mandatory OFFLINE Telegram thumbnail/owner visual quality Hardtest
        if: success() || failure()
        shell: bash
        env:
          TELEGRAM_TOKEN: ''
          SUPABASE_URL: ''
          V2_SUPABASE_URL: ''
          V2_SUPABASE_SERVICE_KEY: ''
          # Synthetic screenshot QA only; the live workflow remains blocked.
          NETRATTLER_BLOCK_OVERPAINTED_MASTERS: '0'
        run: |
          set -o pipefail
          python -m py_compile netrattler_telegram_sandbox_hardtest.py netrattler_card_visual_preview.py
          mkdir -p sandbox-qa
          python - <<'PY'
          from pathlib import Path
          from netrattler_premium_verified_cards import CATEGORIES,render_verified_png
          leg={'match':'OFFLINE HOME vs OFFLINE AWAY','market':'QA ONLY',
               'bookmaker_odds':2.15,'bookmaker':'offline_test_fixture'}
          for category in CATEGORIES:
              count=3 if category in ('combo','builder') else 1
              Path('sandbox-qa/'+category+'_SANDBOX_ONLY.png').write_bytes(
                  render_verified_png(category,[leg.copy() for _ in range(count)]))
          PY
          python netrattler_card_visual_preview.py --outdir visual_review_previews
          python netrattler_telegram_sandbox_hardtest.py 2>&1 | tee netrattler-telegram-visual-hardtest.log
      - name: Upload offline simulated Telegram chat previews for all original families
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-telegram-screen-16-plus-owners
          path: |
            sandbox-telegram-qa/*.png
            sandbox-telegram-qa/report.json
            netrattler-telegram-visual-hardtest.log
          retention-days: 7
          if-no-files-found: warn
      - name: Upload approved-format offline visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-premium-offline-visual-qa
          path: premium-sandbox-preview/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Goal Hunter discovery and 75-second polling offline Hardtest
        if: success() || failure()
        shell: bash
        env:
          LMG_SEND: 'false'
          LMG_SHADOW_ENABLED: 'false'
          TELEGRAM_TOKEN: ''
          SUPABASE_URL: ''
        run: |
          set -o pipefail
          python -m pytest -q -ra test_netrattler_lmg_two_stage.py test_netrattler_lmg_store.py test_netrattler_lmg_fotmob.py 2>&1 | tee netrattler-two-stage-hardtest.log
      - name: Upload diagnostics even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netrattler-sandbox-hardtest
          path: |
            netrattler-hardtest.log
            netrattler-source-tests.log
            netrattler-premium-card-hardtest.log
            netrattler-two-stage-hardtest.log
          if-no-files-found: warn
          retention-days: 7

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats,netrattler_match_history
  V2_SUPABASE_URL: ''  # OFFLINE sandbox never receives DB credentials
  V2_SUPABASE_SERVICE_KEY: ''
