name: NETRATTLER Lineup Builders
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netrattler_lineup_builders.yml"
  schedule:
    - cron: "*/20 8-22 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: netrattler-lineup-builders
  cancel-in-progress: false
jobs:
  lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lineup and image dependencies
        run: python -m pip install --prefer-binary requests pillow pytest
      - name: Verify builder image rendering before delivery
        run: python -m pytest -q test_netrattler_visual_cards.py
      - env:
          API_FOOTBALL_KEYS: ${{ secrets.API_FOOTBALL_KEYS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_PLAYER_PROPS: ${{ secrets.TELEGRAM_GROUP_PLAYER_PROPS }}
          TELEGRAM_GROUP_BUILDER: ${{ secrets.TELEGRAM_GROUP_BUILDER }}
          TELEGRAM_GROUP_STATS: ${{ secrets.TELEGRAM_GROUP_STATS }}
          APIF_LINEUP_MAX_REQ: "1500"
          APIF_LINEUP_PER_RUN: "60"
        run: python netrattler_lineup_builders.py
