name: NETRATTLER Free Odds Live Probe (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_odds_live_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test one league and one market with first configured key
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python netrattler_odds_live_probe.py
