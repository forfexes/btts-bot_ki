name: NETRATTLER PitchAPI Secret Smoke (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/netrattler_pitchapi_secret_test.yml

permissions:
  contents: read

concurrency:
  group: netrattler-pitchapi-single-key-test
  cancel-in-progress: true

jobs:
  pitchapi-key-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PITCHAPI_KEY: \${{ secrets.PITCHAPI_KEY }}
      TELEGRAM_TOKEN: ''
      SUPABASE_URL: ''
      LMG_SEND: 'false'
    steps:
      - name: Test configured PitchAPI key without disclosing credentials
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          key=os.environ.get("PITCHAPI_KEY","").strip()
          if not key:
              print("PITCHAPI_SECRET=missing")
              sys.exit(2)
          print("PITCHAPI_SECRET=present (not displayed)")
          # One safe, officially documented request. No live match or Telegram.
          day=(datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)).strftime("%Y-%m-%d")
          req=Request("https://api.pitchapi.dev/v1/date/"+day,
                      headers={"X-API-KEY":key,"Accept":"application/json",
                               "User-Agent":"NETRATTLER-PitchAPI-Secret-Smoke/1.0"})
          try:
              with urlopen(req,timeout=18) as response:
                  status=response.status
                  data=json.load(response)
                  rows=data.get("data",{}).get("matches")
                  count=len(rows) if isinstance(rows,list) else None
                  valid=isinstance(data,dict) and isinstance(data.get("data"),dict)
          except HTTPError as exc:
              status=exc.code
              count=None
              valid=False
          except (URLError,TimeoutError,ValueError,TypeError,KeyError):
              status="network_or_schema_error"
              count=None
              valid=False
          outcome="VALID" if status==200 and valid else (
              "UNAUTHORIZED" if status==401 else
              "FORBIDDEN" if status==403 else
              "RATE_LIMITED" if status==429 else "ERROR")
          print("PITCHAPI_TEST "+json.dumps({"http_status":status,"result":outcome,
               "historical_matches":count},sort_keys=True))
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary,"a",encoding="utf-8") as output:
                  output.write("PitchAPI read-only check: HTTP "+str(status)+" / "+outcome+
                               ", historical matches="+str(count)+"\n")
          sys.exit(0 if outcome=="VALID" else 3)
          PY
