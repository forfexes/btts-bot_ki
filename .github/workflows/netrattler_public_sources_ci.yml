name: NETRATTLER Public Sources CI

on:
  push:
    branches: [main]
    paths:
      - "netrattler_source_probe.py"
      - "netrattler_public_source_features.py"
      - "netrattler_quote_source_probe.py"
      - ".github/workflows/netrattler_public_sources_ci.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser probe
        run: |
          python -m pip install --prefer-binary requests beautifulsoup4 cloudscraper curl_cffi playwright
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m py_compile netrattler_source_probe.py netrattler_public_source_features.py netrattler_quote_source_probe.py netrattler_prop_sources.py
      - name: Probe keyless bookmaker feeds
        run: python netrattler_quote_source_probe.py
      - name: Probe public football and odds websites
        env:
          NETRATTLER_SOURCE_PROBE_BROWSER: "1"
          NETRATTLER_PUBLIC_SOURCE_BROWSER: "1"
          NETRATTLER_SOURCE_PROBE_TIMEOUT: "12"
          NETRATTLER_PUBLIC_SOURCE_TIMEOUT: "12"
        run: |
          python netrattler_source_probe.py
          python netrattler_public_source_features.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netrattler-public-source-probe
          path: |
            netrattler_quote_source_probe.json
            netrattler_source_probe.json
            netrattler_public_source_summary.json
          if-no-files-found: ignore
