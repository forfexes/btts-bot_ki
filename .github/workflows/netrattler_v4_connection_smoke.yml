name: NETRATTLER V4 Readonly Connection Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_v4_connection_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-readonly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      V4_DATABASE_URL: ${{ secrets.V4_DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: python -m pip install -q psycopg2-binary
      - name: Validate connection and read-only SQL
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, socket
          from urllib.parse import urlsplit
          import psycopg2

          dsn = os.environ.get("V4_DATABASE_URL", "")
          if not dsn:
              print("RESULT=SECRET_MISSING")
              sys.exit(2)
          try:
              u = urlsplit(dsn)
              if u.scheme not in ("postgres", "postgresql") or not u.hostname:
                  raise ValueError("invalid DSN")
              host = u.hostname
              port = u.port or 5432
              print("DSN_TYPE=" + ("POOLER" if host.endswith(".pooler.supabase.com") else "DIRECT" if host.endswith(".supabase.co") else "OTHER"))
              print("PORT=" + str(port))
              if not u.username or u.password is None or not u.password or u.password.startswith("["):
                  print("PASSWORD_PRESENT=false")
              else:
                  print("PASSWORD_PRESENT=true")
          except (ValueError, TypeError):
              print("RESULT=INVALID_DSN")
              sys.exit(2)

          addresses = []
          try:
              addresses = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
              families = {a[0] for a in addresses}
              print("DNS_IPV4=" + str(socket.AF_INET in families).lower())
              print("DNS_IPV6=" + str(socket.AF_INET6 in families).lower())
          except socket.gaierror:
              print("RESULT=DNS_FAILURE")
              sys.exit(1)

          ipv4 = next((a for a in addresses if a[0] == socket.AF_INET), None)
          if ipv4:
              try:
                  with socket.create_connection((ipv4[4][0], port), timeout=7):
                      print("TCP_IPV4=REACHABLE")
              except (OSError, TimeoutError):
                  print("TCP_IPV4=UNREACHABLE")
          else:
              print("TCP_IPV4=NO_ADDRESS")

          try:
              with psycopg2.connect(dsn, connect_timeout=12, sslmode="require", application_name="netrattler_v4_smoke") as conn:
                  conn.set_session(readonly=True)
                  with conn.cursor() as cur:
                      cur.execute("SELECT current_setting('transaction_read_only')")
                      if cur.fetchone()[0] != "on":
                          raise RuntimeError("not read only")
                      cur.execute("SELECT to_regclass('public.odds_history_archive') IS NOT NULL")
                      print("RESULT=CONNECTED_READONLY")
                      print("ARCHIVE_TABLE_PRESENT=" + str(cur.fetchone()[0]).lower())
          except psycopg2.OperationalError as exc:
              # Classify only; never output the exception, host, username, or password.
              msg = str(exc).lower()
              if any(x in msg for x in ("password authentication failed", "authentication failed", "invalid password")):
                  category = "AUTH_FAILED"
              elif any(x in msg for x in ("tenant or user not found", "invalid tenant", "no such user")):
                  category = "POOLER_USER_OR_PROJECT"
              elif any(x in msg for x in ("could not translate host", "name or service not known", "temporary failure in name resolution")):
                  category = "DNS_FAILURE"
              elif any(x in msg for x in ("network is unreachable", "no route to host", "cannot assign requested address")):
                  category = "NETWORK_UNREACHABLE"
              elif any(x in msg for x in ("connection timed out", "timeout expired", "could not connect to server")):
                  category = "CONNECT_TIMEOUT_OR_REFUSED"
              elif any(x in msg for x in ("too many connections", "remaining connection slots")):
                  category = "CONNECTION_LIMIT"
              elif any(x in msg for x in ("server closed the connection", "connection reset")):
                  category = "SERVER_CLOSED_CONNECTION"
              else:
                  category = "OTHER_OPERATIONAL_ERROR"
              print("RESULT=" + category)
              sys.exit(1)
          except Exception as exc:
              print("RESULT=OTHER_" + type(exc).__name__)
              sys.exit(1)
          PY
