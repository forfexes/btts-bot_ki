name: NETRATTLER V4 Readonly Connection Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netrattler_v4_connection_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-readonly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      V4_DATABASE_URL: ${{ secrets.V4_DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: python -m pip install -q psycopg2-binary
      - name: Validate connection and read-only SQL
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit, urlunsplit, quote, unquote
          import psycopg2

          dsn = os.environ.get("V4_DATABASE_URL", "")
          if not dsn:
              print("RESULT=SECRET_MISSING")
              sys.exit(2)
          if not dsn.startswith(("postgres://", "postgresql://")):
              print("RESULT=INVALID_DSN_SCHEME")
              sys.exit(2)
          # Keep connection errors generic: DSNs can contain credentials.
          try:
              with psycopg2.connect(dsn, connect_timeout=12, application_name="netrattler_v4_smoke") as conn:
                  conn.set_session(readonly=True)
                  with conn.cursor() as cur:
                      cur.execute("SELECT current_database(), current_setting('transaction_read_only')")
                      db, read_only = cur.fetchone()
                      if read_only != "on":
                          raise RuntimeError("read-only mode not active")
                      cur.execute("SELECT to_regclass('public.odds_history_archive') IS NOT NULL")
                      has_archive = cur.fetchone()[0]
                      print("RESULT=CONNECTED_READONLY")
                      print("ARCHIVE_TABLE_PRESENT=" + str(has_archive).lower())
          except Exception as exc:
              print("RESULT=CONNECTION_FAILED")
              print("ERROR_TYPE=" + type(exc).__name__)
              sys.exit(1)
          PY
