name: NETRATTLER 1x Player Snapshot Collector
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: x1-snapshots
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --prefer-binary requests beautifulsoup4 cloudscraper
      - run: python test_x1_snapshot_collector.py
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_x1_snapshot_collector.py
