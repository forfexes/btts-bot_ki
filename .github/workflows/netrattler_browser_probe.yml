name: NETRATTLER Browser Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright requests && python -m playwright install --with-deps chromium
      - name: Probe public aggregator pages (plain headless browser)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python netrattler_browser_probe.py

# Route player tables to the archive project (V2); see netrattler_table_router.py
env:
  PYTHONPATH: ${{ github.workspace }}
  NETRATTLER_ROUTE_TABLES: player_match_stats
  V2_SUPABASE_URL: ${{ secrets.V2_SUPABASE_URL }}
  V2_SUPABASE_SERVICE_KEY: ${{ secrets.V2_SUPABASE_SERVICE_KEY }}
